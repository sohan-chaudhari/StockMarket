# LEVERAGE reverse proxy. Phase 9 of the production deployment sprint.
#
# Topology: this config assumes Nginx runs as its own container on the same
# Docker Compose network as the app container (see docker-compose.yml),
# proxying to the app by its service name -- NOT 127.0.0.1/localhost, which
# from inside the nginx container would mean the nginx container itself,
# not the app.
#
# Two location blocks, not one blanket config: normal HTTP API/static
# traffic gets ordinary timeouts, and only the two WebSocket paths LEVERAGE
# actually has (/ws/dashboard, /ws/user) get the long-lived timeout. There
# is no SSE anywhere in this app (verified repo-wide in Phase 7/9) so no
# SSE-specific handling is needed.

upstream leverage_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;  # no file-upload endpoints exist; JSON API bodies only

    # Conservative, non-breaking security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP + SECURITY HEADERS PRODUCTION HARDENING phase.
    #
    # Report-Only, not enforced -- a full repo-wide asset audit (every HTML/JS
    # file under frontend/) found the frontend is a classic, non-bundled,
    # server-templating-free (FastAPI StaticFiles, no Jinja2) multi-page app
    # with pervasive inline <script> blocks, 647 inline style="..." attributes
    # across 25 files, inline <style> blocks in 22 files, and 287 inline
    # onclick/onchange/... event-handler attributes across 22 files. An
    # enforcing script-src/style-src without 'unsafe-inline' would break
    # nearly every page; adding 'unsafe-inline' would defeat CSP's XSS
    # protection for the exact class of bug it exists to catch. Neither is
    # acceptable for this phase, so this ships as Report-Only: it can never
    # block/break anything, and gives real violation data (visible in each
    # browser's own DevTools console -- no report-uri/report-to is set,
    # since no CSP-report collection endpoint exists in the backend and this
    # phase does not add one or introduce a third-party reporting service)
    # for a future dedicated "eliminate inline JS/CSS" phase before ever
    # flipping this to enforcing Content-Security-Policy.
    #
    # Every non-'self' origin below is traced to a specific, real asset:
    #   https://fonts.googleapis.com  -- Google Fonts stylesheet <link> (most pages)
    #   https://fonts.gstatic.com     -- the actual Google Fonts font files that stylesheet loads
    #   https://cdnjs.cloudflare.com  -- jspdf (portfolio.html, static <script>),
    #                                    html2pdf.js (overview.html/stock-ui.js,
    #                                    injected via createElement('script') for
    #                                    the "download PDF" feature), and
    #                                    Font Awesome's CSS + its webfont files
    #                                    (portfolio.html)
    # No 'unsafe-eval' (zero eval()/new Function() found anywhere in
    # frontend/*.js). No data:/blob: (no data: URLs found in any HTML/CSS).
    # No frame-src/worker-src/child-src origins (no <iframe>, Worker,
    # ServiceWorker, or WebAssembly found anywhere). object-src/base-uri
    # locked down per standard guidance -- neither <object>/<embed> nor
    # <base> exist in this app. frame-ancestors 'self' mirrors the existing
    # X-Frame-Options: SAMEORIGIN above exactly (same intent, modern
    # directive). form-action 'self' is safe -- every <form> in this app
    # posts via JS/fetch to same-origin /api/... endpoints, with
    # action="#"/no real action attribute.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self'; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self'; worker-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Locks down browser APIs this app's frontend never calls (verified: no
    # navigator.geolocation, getUserMedia, <video>/<audio> anywhere in
    # frontend/*.{html,js}). Safe, low-risk addition -- unlike CSP this has
    # no inline-script/style compatibility concern to audit around.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # ── WebSocket: /ws/dashboard (live prices, Phase 7 bounded) and
    # /ws/user (private order/execution updates) ──
    location ~ ^/ws/(dashboard|user)$ {
        proxy_pass http://leverage_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections: a chart left open for hours must not have
        # its WebSocket silently killed by an idle-timeout default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # No proxy buffering on a WebSocket -- ticks must reach the client
        # as they're written, not held until a buffer fills.
        proxy_buffering off;
    }

    # ── Everything else: REST, charts, indicators, health, static frontend ──
    location / {
        proxy_pass http://leverage_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ordinary request timeouts -- chart/indicator endpoints can do real
        # work (candle aggregation, yfinance fallback) but are still
        # request/response, not long-lived like the WS paths above.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ── TLS ──
# Not configured in this sprint: no certificate material exists in this
# repository (correctly -- .pem/.key files must never be committed) and no
# existing TLS termination point was found during repository discovery.
# When a certificate is available (e.g. via ACME/Let's Encrypt or an
# AWS/ALB-terminated cert), add a second `server { listen 443 ssl; }` block
# here pointing `ssl_certificate`/`ssl_certificate_key` at the external
# mount path your deployment provides (e.g. a Docker secret or a volume
# mounted by certbot) -- do not hard-code a path without confirming the
# actual deployment target first.
