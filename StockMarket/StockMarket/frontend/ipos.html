<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPOs - LEVERAGE</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0A0A0B; color: #fff; font-family: 'Inter', sans-serif; }
        .page-content { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .page-subtitle { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 2rem; }
        .ipo-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .ipo-table th { text-align: left; padding: 0.75rem; color: #a1a1aa; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .ipo-table td { padding: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.04); color: #fff; }
        .ipo-table tr:hover { background: rgba(255,255,255,0.02); }
        .badge { font-size: 0.7rem; padding: 2px 10px; border-radius: 12px; font-weight: 600; }
        .badge-open { background: rgba(0,230,118,0.15); color: #00E676; }
        .badge-closed { background: rgba(255,255,255,0.08); color: #a1a1aa; }
        .badge-upcoming { background: rgba(74,144,226,0.15); color: #4A90E2; }
        .tabs { display: flex; gap: 4px; background: #1a1a1a; border-radius: 8px; padding: 3px; margin-bottom: 1.25rem; }
        .tab { padding: 6px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; color: #a1a1aa; cursor: pointer; border: none; background: none; }
        .tab.active { background: #333; color: #fff; }
    </style>
    <script src="page-cache.js"></script>
</head>
<body>
    <div id="nav-root"></div>
    <main class="page-content">
        <h1 class="page-title">Initial Public Offerings (IPOs)</h1>
        <p class="page-subtitle">Upcoming, open, and recently listed IPOs</p>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('open',this)">Open</button>
            <button class="tab" onclick="switchTab('upcoming',this)">Upcoming</button>
            <button class="tab" onclick="switchTab('listed',this)">Recently Listed</button>
        </div>
        <table class="ipo-table">
            <thead><tr><th>Company</th><th>Price Band</th><th>Open</th><th>Close</th><th>Lot Size</th><th>Status</th></tr></thead>
            <tbody id="ipoBody"></tbody>
        </table>
    </main>
    <script>
        var allIPOs = [
            {company:'NextGen AI Solutions',band:'₹245-258',open:'15 Jul 2025',close:'17 Jul 2025',lot:'60',status:'open'},
            {company:'Green Energy Corp',band:'₹180-190',open:'22 Jul 2025',close:'24 Jul 2025',lot:'75',status:'open'},
            {company:'Fintech India Ltd',band:'₹320-340',open:'10 Aug 2025',close:'12 Aug 2025',lot:'45',status:'upcoming'},
            {company:'HealthTech Innovations',band:'₹280-295',open:'18 Aug 2025',close:'20 Aug 2025',lot:'50',status:'upcoming'},
            {company:'Space Ventures Ltd',band:'₹450-475',open:'5 Sep 2025',close:'8 Sep 2025',lot:'30',status:'upcoming'},
            {company:'CyberSec Solutions',band:'₹195-205',open:'28 Jun 2025',close:'30 Jun 2025',lot:'70',status:'listed'},
            {company:'EV Motors India',band:'₹150-160',open:'15 Jun 2025',close:'17 Jun 2025',lot:'90',status:'listed'},
            {company:'CloudNine Tech',band:'₹400-425',open:'5 Jun 2025',close:'7 Jun 2025',lot:'35',status:'listed'},
            {company:'BioPharma Research',band:'₹210-225',open:'20 May 2025',close:'22 May 2025',lot:'65',status:'listed'},
        ];

        function switchTab(tab,btn){
            document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
            btn.classList.add('active');
            var filtered = allIPOs.filter(function(ipo){return ipo.status===tab;});
            var body = document.getElementById('ipoBody');
            if(filtered.length===0){
                body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#a1a1aa;">No IPOs in this category</td></tr>';
                return;
            }
            body.innerHTML = filtered.map(function(ipo){
                var badgeClass = ipo.status==='open'?'badge-open':(ipo.status==='upcoming'?'badge-upcoming':'badge-closed');
                var statusText = ipo.status==='open'?'Open for Subscription':(ipo.status==='upcoming'?'Upcoming':'Listed');
                return '<tr><td style="font-weight:600;">'+ipo.company+'</td><td>'+ipo.band+'</td><td>'+ipo.open+'</td><td>'+ipo.close+'</td><td>'+ipo.lot+'</td><td><span class="badge '+badgeClass+'">'+statusText+'</span></td></tr>';
            }).join('');
        }
        switchTab('open',document.querySelector('.tab'));
    </script>
    <script src="nav.js?v=3"></script>
</body>
</html>
