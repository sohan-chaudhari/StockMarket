<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist - LEVERAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css?v=2">

    <style>
        .wl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
        .wl-title{font-size:1.5rem;font-weight:700;}
        .wl-subtitle{color:var(--text-secondary);font-size:0.9rem;}
        .wl-tabs{display:flex;gap:4px;background:#1a1a1a;border-radius:8px;padding:3px;margin-bottom:1.25rem;}
        .wl-tab{padding:6px 16px;border-radius:6px;font-size:0.8rem;font-weight:500;color:var(--text-secondary);cursor:pointer;border:none;background:none;transition:all 0.15s;font-family:'Inter',sans-serif;}
        .wl-tab.active{background:#333;color:#fff;}
        /* ---- List layout ---- */
        .wl-grid{display:flex;flex-direction:column;border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
        .wl-card{display:flex;align-items:center;gap:0.75rem;padding:0.8rem 1rem;background:#111;border:none;border-bottom:1px solid rgba(255,255,255,0.06);border-radius:0;cursor:pointer;transition:background 0.15s;position:relative;}
        .wl-card:last-child{border-bottom:none;}
        .wl-card:hover{background:#181818;}
        .wl-card .wl-left{display:flex;flex-direction:column;gap:2px;min-width:100px;}
        .wl-card h4{font-size:0.95rem;font-weight:700;color:#fff;margin:0;white-space:nowrap;}
        .wl-card .exchange{font-size:0.62rem;color:var(--text-secondary);padding:1px 5px;background:rgba(255,255,255,0.05);border-radius:3px;align-self:flex-start;margin-top:2px;}
        .wl-card .wl-mid{display:flex;gap:0.5rem;align-items:center;font-size:0.72rem;font-family:'Roboto Mono',monospace;}
        .wl-card .wl-mid .tp{color:#089981;}
        .wl-card .wl-mid .sl{color:#f23645;}
        .wl-card .wl-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:110px;margin-left:auto;}
        .wl-card .price{font-size:0.95rem;font-weight:700;font-family:'Roboto Mono',monospace;}
        .wl-card .change{font-size:0.75rem;font-weight:600;font-family:'Roboto Mono',monospace;}
        .wl-card .wl-actions{display:flex;align-items:center;gap:4px;margin-left:0.5rem;}
        .wl-card .wl-actions button{width:28px;height:28px;border:none;border-radius:6px;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;}
        .wl-card .wl-actions .alert-btn{background:rgba(255,215,0,0.1);color:#ffd700;}
        .wl-card .wl-actions .alert-btn:hover{background:rgba(255,215,0,0.22);}
        .wl-card .wl-actions .trash-btn{background:rgba(242,54,69,0.1);color:#f23645;}
        .wl-card .wl-actions .trash-btn:hover{background:rgba(242,54,69,0.22);}
        .wl-add{display:flex;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-start;}
        .wl-search-wrap{position:relative;flex:1;max-width:320px;}
        .wl-add input{width:100%;padding:0.65rem 1rem;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;box-sizing:border-box;}
        .wl-add input:focus{border-color:var(--accent-blue);}
        .wl-add button{padding:0.65rem 1.25rem;background:var(--accent-blue);border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;font-size:0.85rem;white-space:nowrap;}
        .wl-dropdown{position:absolute;top:calc(100% + 4px);left:0;width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;z-index:200;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.5);}
        .wl-dropdown.open{display:block;}
        .wl-drop-item{padding:0.6rem 1rem;cursor:pointer;font-size:0.85rem;color:#fff;display:flex;align-items:center;justify-content:space-between;transition:background 0.1s;}
        .wl-drop-item:hover{background:rgba(74,144,226,0.12);}
        .wl-drop-item .dup-badge{font-size:0.65rem;padding:2px 6px;background:rgba(255,215,0,0.15);color:#ffd700;border-radius:4px;font-weight:600;}
        .wl-drop-item .exch{font-size:0.7rem;color:var(--text-secondary);}
        .wl-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:0.65rem 1.25rem;font-size:0.85rem;color:#fff;z-index:9999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
        .wl-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
        .wl-toast.warn{border-color:rgba(255,215,0,0.4);color:#ffd700;}
        .wl-toast.success{border-color:rgba(8,153,129,0.4);color:#089981;}
        .alert-notif-wrap{position:fixed;top:80px;right:1.25rem;z-index:9998;display:flex;flex-direction:column;gap:0.5rem;pointer-events:none;}
        .alert-notif{background:#13141b;border:1px solid rgba(8,153,129,0.35);border-left:4px solid #089981;border-radius:10px;padding:1rem 1.25rem;min-width:280px;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.6);pointer-events:all;animation:notifIn 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;}
        .alert-notif.above{border-color:rgba(8,153,129,0.35);border-left-color:#089981;}
        .alert-notif.below{border-color:rgba(242,54,69,0.35);border-left-color:#f23645;}
        @keyframes notifIn{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:translateX(0);}}
        @keyframes notifOut{from{opacity:1;transform:translateX(0);}to{opacity:0;transform:translateX(60px);}}
        .alert-notif-exit{animation:notifOut 0.25s ease forwards;pointer-events:none;}
        .alert-notif .notif-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem;}
        .alert-notif .notif-badge{font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:4px;background:rgba(8,153,129,0.15);color:#089981;}
        .alert-notif.below .notif-badge{background:rgba(242,54,69,0.15);color:#f23645;}
        .alert-notif .notif-close{background:none;border:none;color:#52525b;cursor:pointer;font-size:1rem;line-height:1;padding:0;transition:color 0.15s;}
        .alert-notif .notif-close:hover{color:#fff;}
        .alert-notif .notif-ticker{font-size:1rem;font-weight:700;color:#fff;}
        .alert-notif .notif-msg{font-size:0.8rem;color:#a1a1aa;margin-top:0.15rem;}
        .alert-notif .notif-price{font-size:1.1rem;font-weight:700;font-family:'Roboto Mono',monospace;margin-top:0.4rem;}
        .alert-notif .notif-dismiss{margin-top:0.75rem;width:100%;padding:0.4rem;background:rgba(255,255,255,0.06);border:none;border-radius:6px;color:#fff;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s;}
        .alert-notif .notif-dismiss:hover{background:rgba(255,255,255,0.12);}
        .text-green{color:#089981;}.text-red{color:#f23645;}
        .wl-empty{text-align:center;padding:3rem;color:var(--text-secondary);}
        .wl-empty .icon{font-size:3rem;margin-bottom:1rem;}
        .wl-limit-bar{display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;font-size:0.8rem;color:var(--text-secondary);}
        .wl-limit-dots{display:flex;gap:3px;}
        .wl-dot{width:8px;height:8px;border-radius:50%;background:#333;transition:background 0.2s;}
        .wl-dot.filled{background:var(--accent-blue);}
        .wl-dot.filled.near{background:#ffd700;}
        .wl-dot.filled.full{background:#f23645;}
        @keyframes wlCardIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
        .wl-card-enter{animation:wlCardIn 0.2s ease forwards;}
        @keyframes wlCardOut{from{opacity:1;max-height:60px;}to{opacity:0;max-height:0;padding-top:0;padding-bottom:0;}}
        .wl-card-exit{animation:wlCardOut 0.2s ease forwards;overflow:hidden;pointer-events:none;}
        .modal .content{background:#13141b;border:1px solid #1e222d;border-radius:12px;padding:1.5rem;max-width:360px;width:90%;}
        .modal .content h3{font-size:1.1rem;font-weight:600;margin-bottom:1rem;}
        .modal .content input{width:100%;padding:0.6rem;background:#1a1a2e;border:1px solid #333;border-radius:6px;color:#fff;margin-bottom:0.75rem;font-family:'Inter',sans-serif;outline:none;}
        .modal .content input:focus{border-color:var(--accent-blue);}
        .modal .content .btns{display:flex;gap:0.75rem;}
        .modal .content button{padding:0.5rem 1rem;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
        /* ===== MOBILE STYLES (max-width: 768px) ===== */
        @media(max-width:768px){
            .wl-header{flex-direction:column;align-items:flex-start;gap:0.2rem;margin-bottom:0.85rem;}
            .wl-title{font-size:1.2rem;}
            .wl-subtitle{font-size:0.78rem;}
            .wl-limit-bar{flex-wrap:wrap;gap:0.35rem;margin-bottom:0.65rem;}
            .wl-limit-dots{flex-wrap:wrap;gap:2px;}
            .wl-dot{width:7px;height:7px;}
            .wl-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:0.85rem;}
            .wl-tab{padding:7px 4px;font-size:0.72rem;text-align:center;white-space:nowrap;}
            .wl-add{flex-direction:column;gap:0.5rem;margin-bottom:0.85rem;}
            .wl-search-wrap{max-width:100%;width:100%;}
            .wl-add input{font-size:0.85rem;}
            .wl-add button{width:100%;padding:0.6rem 1rem;font-size:0.85rem;}
            .wl-card{padding:0.65rem 0.75rem;gap:0.4rem;}
            .wl-card .wl-left{min-width:72px;}
            .wl-card h4{font-size:0.85rem;}
            .wl-card .wl-right{min-width:86px;}
            .wl-card .price{font-size:0.85rem;}
            .wl-card .change{font-size:0.68rem;}
            .wl-card .wl-mid{display:none;}
            .wl-card .wl-actions button{width:26px;height:26px;font-size:0.72rem;}
            .alert-notif-wrap{top:auto;bottom:1rem;right:0.75rem;left:0.75rem;}
            .alert-notif{min-width:0;max-width:100%;width:100%;}
            .modal .content{max-width:100%;width:92%;padding:1.25rem;}
        }
    </style>
    <script src="page-cache.js"></script>
    <script src="ws.js"></script>

<body style="background-color: #0A0A0B;">
    <div id="nav-root"></div>
    <main class="page-content">
        <div class="wl-header">
            <div>
                <h1 class="wl-title">Watchlist</h1>
                <p class="wl-subtitle">Track stocks across multiple strategies with alerts &amp; targets</p>
            </div>
        </div>
        <div class="wl-limit-bar">
            <span id="wlLimitText">0 / 15 stocks</span>
            <div class="wl-limit-dots" id="wlLimitDots"></div>
        </div>
        <div class="wl-tabs">
            <button class="wl-tab active" onclick="switchList('longterm',this)">Long Term</button>
            <button class="wl-tab" onclick="switchList('intraday',this)">Intraday</button>
            <button class="wl-tab" onclick="switchList('swing',this)">Swing Trades</button>
        </div>
        <div id="wlPersistNote" style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:0.75rem;display:flex;align-items:center;gap:4px;">
            <span style="color:#089981;">&#9729;</span> <span id="wlPersistText">Synced to your account</span>
        </div>
        <div class="wl-add">
            <div class="wl-search-wrap">
                <input type="text" id="addTickerInput" placeholder="Search stock to add (e.g. RELIANCE)"
                    oninput="onSearchInput(this.value)"
                    onkeydown="if(event.key==='Enter')addTicker()"
                    autocomplete="off">
                <div class="wl-dropdown" id="wlDropdown"></div>
            </div>
            <button onclick="addTicker()">+ Add</button>
        </div>
        <div class="wl-toast" id="wlToast"></div>
        <!-- Custom alert notification container (replaces browser alert) -->
        <div class="alert-notif-wrap" id="alertNotifWrap"></div>
        <div id="watchlistGrid" class="wl-grid"></div>
    </main>

    <div class="modal" id="alertModal">
        <div class="content">
            <h3>Set Price Alert</h3>
            <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.75rem;" id="alertTickerLabel">For </p>
            <label for="alertPrice" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.3rem;">Alert price</label>
            <input type="number" id="alertPrice" placeholder="Alert when price reaches..." step="0.05">
            <label for="alertCondition" style="display:block;font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.3rem;">Condition</label>
            <select id="alertCondition" style="width:100%;padding:0.6rem;background:#1a1a2e;border:1px solid #333;border-radius:6px;color:#fff;margin-bottom:0.75rem;font-family:'Inter',sans-serif;outline:none;">
                <option value="above">Above</option>
                <option value="below">Below</option>
            </select>
            <div class="btns"><button onclick="saveAlert()" style="background:var(--accent-blue);color:#fff;flex:1;">Save</button><button onclick="closeAlertModal()" style="background:#333;color:#fff;">Cancel</button></div>
        </div>
    </div>

    <script>
        (function(){
            // ---- Known stocks for search autocomplete ----------------------------------------------------------
            var KNOWN_STOCKS = [
                {ticker:'RELIANCE',name:'Reliance Industries'},{ticker:'TCS',name:'Tata Consultancy Services'},
                {ticker:'HDFCBANK',name:'HDFC Bank'},{ticker:'INFY',name:'Infosys'},
                {ticker:'ICICIBANK',name:'ICICI Bank'},{ticker:'BHARTIARTL',name:'Bharti Airtel'},
                {ticker:'SBIN',name:'State Bank of India'},{ticker:'HINDUNILVR',name:'Hindustan Unilever'},
                {ticker:'ITC',name:'ITC Limited'},{ticker:'LT',name:'Larsen & Toubro'},
                {ticker:'KOTAKBANK',name:'Kotak Mahindra Bank'},{ticker:'AXISBANK',name:'Axis Bank'},
                {ticker:'ASIANPAINT',name:'Asian Paints'},{ticker:'MARUTI',name:'Maruti Suzuki'},
                {ticker:'WIPRO',name:'Wipro'},{ticker:'TITAN',name:'Titan Company'},
                {ticker:'SUNPHARMA',name:'Sun Pharmaceutical'},{ticker:'BAJFINANCE',name:'Bajaj Finance'},
                {ticker:'ADANIENT',name:'Adani Enterprises'},{ticker:'TATAMOTORS',name:'Tata Motors'},
                {ticker:'NTPC',name:'NTPC Limited'},{ticker:'ONGC',name:'Oil & Natural Gas Corp'},
                {ticker:'POWERGRID',name:'Power Grid Corporation'},{ticker:'ULTRACEMCO',name:'UltraTech Cement'},
                {ticker:'TATASTEEL',name:'Tata Steel'},{ticker:'JSWSTEEL',name:'JSW Steel'},
                {ticker:'TECHM',name:'Tech Mahindra'},{ticker:'HAL',name:'Hindustan Aeronautics'},
                {ticker:'BEL',name:'Bharat Electronics'},{ticker:'ZOMATO',name:'Zomato'},
                {ticker:'TRENT',name:'Trent Limited'},{ticker:'INDUSINDBK',name:'IndusInd Bank'},
                {ticker:'BAJAJFINSV',name:'Bajaj Finserv'},{ticker:'DLF',name:'DLF Limited'},
                {ticker:'VEDL',name:'Vedanta'},{ticker:'ADANIPORTS',name:'Adani Ports'},
                {ticker:'CIPLA',name:'Cipla'},{ticker:'DRREDDY',name:'Dr. Reddy\'s Laboratories'},
                {ticker:'APOLLOHOSP',name:'Apollo Hospitals'},{ticker:'HDFCLIFE',name:'HDFC Life Insurance'},
                {ticker:'COALINDIA',name:'Coal India'},{ticker:'BPCL',name:'Bharat Petroleum'},
                {ticker:'IOC',name:'Indian Oil Corporation'},{ticker:'GAIL',name:'GAIL India'},
                {ticker:'BRITANNIA',name:'Britannia Industries'},{ticker:'EICHERMOT',name:'Eicher Motors'},
                {ticker:'NIFTY',name:'NIFTY 50 Index'},{ticker:'BANKNIFTY',name:'Bank Nifty Index'},
                {ticker:'SENSEX',name:'BSE SENSEX Index'}
            ];

            var DEFAULT_TICKERS = ['RELIANCE','TCS','HDFCBANK','INFY','ICICIBANK'];
            var currentList = 'longterm';
            var watchlists = {longterm:[],intraday:[],swing:[]};
            var alerts = JSON.parse(localStorage.getItem('leverage_alerts')||'[]');
            var alertTicker = '';
            var targets = JSON.parse(localStorage.getItem('leverage_targets')||'{}');

            function _wlToken() { return sessionStorage.getItem('token'); }

            async function loadWatchlists(){
                watchlists = {longterm:[],intraday:[],swing:[]};
                var token = _wlToken();
                if (token) {
                    try {
                        var res = await fetch('/api/watchlist', { headers: { 'Authorization': 'Bearer ' + token } });
                        if (res.ok) {
                            var data = await res.json();
                            if (data.watchlist && data.watchlist.length > 0) {
                                watchlists.longterm = data.watchlist.map(function(i){ return i.ticker; });
                                try { localStorage.setItem('_wl_cache', JSON.stringify(watchlists.longterm)); } catch(e) {}
                                return;
                            }
                        }
                    } catch(e) {}
                }
                watchlists.longterm = DEFAULT_TICKERS.slice();
            }
            function saveWatchlists(){} // saved via API
            function saveAlerts(){ try{localStorage.setItem('leverage_alerts',JSON.stringify(alerts));}catch(e){} }
            function saveTargets(){ try{localStorage.setItem('leverage_targets',JSON.stringify(targets));}catch(e){} }

            // ---- Toast notification ----------------------------------------------------------------------------------------------
            function showToast(msg, type){
                var t = document.getElementById('wlToast');
                t.innerHTML = msg;
                t.className = 'wl-toast show ' + (type||'');
                clearTimeout(t._timer);
                t._timer = setTimeout(function(){ t.className = 'wl-toast'; }, 2800);
            }

            // ---- Search autocomplete dropdown with all stocks & intelligent match scoring ----
            function _wlLevenshtein(a, b) {
                if (a === b) return 0;
                if (!a.length) return b.length;
                if (!b.length) return a.length;
                var row = [];
                for (var i = 0; i <= b.length; i++) row[i] = i;
                for (var i = 1; i <= a.length; i++) {
                    var prev = i;
                    for (var j = 1; j <= b.length; j++) {
                        var val = (a.charAt(i - 1) === b.charAt(j - 1)) ? row[j - 1] : Math.min(row[j - 1] + 1, Math.min(prev + 1, row[j] + 1));
                        row[j - 1] = prev;
                        prev = val;
                    }
                    row[b.length] = prev;
                }
                return row[b.length];
            }

            function getWatchlistStockSource() {
                if (typeof window !== 'undefined' && Array.isArray(window.ALL_STOCKS) && window.ALL_STOCKS.length > 0) {
                    return window.ALL_STOCKS;
                }
                try {
                    var stored = localStorage.getItem('leverage_stocks');
                    if (stored) {
                        var parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            window.ALL_STOCKS = parsed;
                            return parsed;
                        }
                    }
                } catch(e) {}
                return (typeof KNOWN_STOCKS !== 'undefined') ? KNOWN_STOCKS : [];
            }

            function getWatchlistScore(stock, query) {
                var cleanQuery = query.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (!cleanQuery) return 0;
                if (cleanQuery.endsWith('ns')) cleanQuery = cleanQuery.slice(0, -2);
                else if (cleanQuery.endsWith('bo')) cleanQuery = cleanQuery.slice(0, -2);

                var ticker = (stock.ticker || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                var rawName = (stock.name || '').toLowerCase();
                var cleanName = rawName.replace(/[^a-z0-9]/g, '');

                if (ticker === cleanQuery) return 1000;
                if (ticker.startsWith(cleanQuery)) return 800;
                if (cleanName.startsWith(cleanQuery)) return 700;

                var words = rawName.split(/[\s\-_\.,]+/);
                for (var i = 0; i < words.length; i++) {
                    var w = words[i].replace(/[^a-z0-9]/g, '');
                    if (w && w.startsWith(cleanQuery)) return 600;
                }

                if (ticker.indexOf(cleanQuery) !== -1) return 500;
                if (cleanName.indexOf(cleanQuery) !== -1) return 400;

                var isIndex = ['NIFTY', 'BANKNIFTY', 'SENSEX'].indexOf(stock.ticker) !== -1;
                if (isIndex && (query.toLowerCase().startsWith('nse ') || query.toLowerCase().startsWith('bse '))) {
                    var subQuery = query.toLowerCase().split(' ').slice(1).join(' ').replace(/[^a-z0-9]/g, '');
                    if (subQuery && (ticker.startsWith(subQuery) || cleanName.startsWith(subQuery))) return 550;
                }

                if (cleanQuery.length >= 3) {
                    var maxDist = cleanQuery.length >= 6 ? 2 : 1;
                    var tDistPref = _wlLevenshtein(ticker.slice(0, cleanQuery.length), cleanQuery);
                    var tDistFull = _wlLevenshtein(ticker, cleanQuery);
                    var tDist = Math.min(tDistPref, tDistFull);
                    if (tDist <= maxDist) return 300 - tDist * 50;

                    for (var j = 0; j < words.length; j++) {
                        var word = words[j].replace(/[^a-z0-9]/g, '');
                        if (word.length >= 3) {
                            var wDistPref = _wlLevenshtein(word.slice(0, cleanQuery.length), cleanQuery);
                            var wDistFull = _wlLevenshtein(word, cleanQuery);
                            var wDist = Math.min(wDistPref, wDistFull);
                            if (wDist <= maxDist) return 250 - wDist * 50;
                        }
                    }
                }
                return 0;
            }

            window.onSearchInput = function(val){
                var q = val.trim();
                var drop = document.getElementById('wlDropdown');
                if(!q){ drop.classList.remove('open'); drop.innerHTML=''; return; }
                
                var source = getWatchlistStockSource();
                var scored = source.map(function(s){ return { stock: s, score: getWatchlistScore(s, q) }; })
                    .filter(function(item){ return item.score > 0; });
                
                scored.sort(function(a, b){
                    var diff = b.score - a.score;
                    if (diff !== 0) return diff;
                    if (a.stock.exchange === 'NSE') return -1;
                    if (b.stock.exchange === 'NSE') return 1;
                    return 0;
                });

                var matches = scored.slice(0, 8).map(function(item){ return item.stock; });
                if(!matches.length){
                    drop.innerHTML = '<div style="padding:0.75rem 1rem;color:var(--text-muted);font-size:0.8rem;text-align:center;">No stocks found</div>';
                    drop.classList.add('open');
                    return;
                }
                var list = watchlists[currentList] || [];
                drop.innerHTML = matches.map(function(s){
                    var cleanTicker = (s.ticker || '').replace(/\.(NS|BO)$/i, '');
                    var alreadyIn = list.indexOf(cleanTicker) >= 0 || list.indexOf(s.ticker) >= 0;
                    var type = s.exchange || (['NIFTY','BANKNIFTY','SENSEX'].indexOf(cleanTicker) !== -1 ? 'INDEX' : 'NSE');
                    return '<div class="wl-drop-item" onclick="selectStock(\''+cleanTicker+'\')">'
                        + '<span><strong>'+cleanTicker+'</strong> &nbsp;<span class="exch">'+(s.name || cleanTicker)+'</span></span>'
                        + '<div style="display:flex;align-items:center;gap:6px;">'
                        + '<span style="font-size:0.65rem;color:var(--text-secondary);background:rgba(255,255,255,0.06);padding:2px 5px;border-radius:4px;">'+type+'</span>'
                        + (alreadyIn ? '<span class="dup-badge">In list</span>' : '')
                        + '</div>'
                        + '</div>';
                }).join('');
                drop.classList.add('open');
            };

            window.selectStock = function(ticker){
                document.getElementById('addTickerInput').value = ticker;
                document.getElementById('wlDropdown').classList.remove('open');
                addTicker();
            };

            // Close dropdown on outside click
            document.addEventListener('click', function(e){
                if(!e.target.closest('.wl-search-wrap')){
                    var drop = document.getElementById('wlDropdown');
                    if(drop) drop.classList.remove('open');
                }
            });

            window.addEventListener('stocksLoaded', function(){
                var inp = document.getElementById('addTickerInput');
                if(inp && inp.value.trim()){ window.onSearchInput(inp.value); }
                // Re-render cards so exchange badges update once ALL_STOCKS is available
                if (document.getElementById('watchlistGrid') && document.getElementById('watchlistGrid').querySelector('.wl-card')) { renderImmediate(); }
            });
            // ---- Watchlist limit ----------------------------------------------------------------------------------------------------
            var MAX_LIMIT = 15;

            function updateLimitBar(){
                var count = (watchlists[currentList] || []).length;
                var textEl = document.getElementById('wlLimitText');
                var dotsEl = document.getElementById('wlLimitDots');
                if(textEl) textEl.textContent = count + ' / ' + MAX_LIMIT + ' stocks';
                if(dotsEl){
                    var html = '';
                    for(var i = 0; i < MAX_LIMIT; i++){
                        var cls = i < count ? 'wl-dot filled' : 'wl-dot';
                        if(i < count){
                            if(count >= MAX_LIMIT) cls += ' full';
                            else if(count >= MAX_LIMIT - 3) cls += ' near';
                        }
                        html += '<div class="' + cls + '"></div>';
                    }
                    dotsEl.innerHTML = html;
                }
            }

            // ---- Build a single list row (with instant llp seed) --------------------------------------------------
            function _getExchange(t) {
                var indices = ['NIFTY','BANKNIFTY','SENSEX','FINNIFTY'];
                if (indices.indexOf(t) !== -1) return 'INDEX';
                var src = (typeof window !== 'undefined' && Array.isArray(window.ALL_STOCKS)) ? window.ALL_STOCKS : [];
                for (var i = 0; i < src.length; i++) {
                    var s = src[i];
                    var clean = (s.ticker || '').replace(/\.(NS|BO)$/i, '');
                    if (clean === t || s.ticker === t) return s.exchange || 'NSE';
                }
                return 'NSE'; // default fallback
            }

            function buildCard(t){
                var listTargets = targets[currentList] || {};
                var tgt = listTargets[t] || {}; var tp = tgt.tp; var sl = tgt.sl;
                var tpHTML = tp ? '<span class="tp">TP \u20B9'+tp.toFixed(2)+'</span>' : '';
                var slHTML = sl ? '<span class="sl">SL \u20B9'+sl.toFixed(2)+'</span>' : '';

                var seedPrice = '--';
                var seedChg = 'Fetching\u2026';
                var color = 'var(--text-secondary)';
                try {
                    var _llpTs = parseInt(localStorage.getItem('llp_ts') || '0', 10);
                    if (Date.now() - _llpTs > 600000) throw 'stale';
                    var llp = JSON.parse(localStorage.getItem('llp') || '{}');
                    var d = llp[t];
                    if (d && d.current) {
                        var p = d.current; var o = d.open || p;
                        var diff = p - o; var pct = o > 0 ? (diff/o)*100 : 0;
                        var sign = diff >= 0 ? '+' : '';
                        color = diff >= 0 ? '#089981' : '#f23645';
                        seedPrice = '\u20B9' + p.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
                        seedChg = sign + diff.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)';
                    }
                } catch(e) {}

                var exch = _getExchange(t);

                var el = document.createElement('div');
                el.className = 'wl-card wl-card-enter';
                el.id = 'wlcard_' + t;
                // Entire row click → overview page
                el.onclick = function(){ openChart(t); };
                el.innerHTML =
                    '<div class="wl-left">'
                    + '<h4>' + t + '</h4>'
                    + '<span class="exchange">' + exch + '</span>'
                    + '</div>'
                    + '<div class="wl-mid">' + tpHTML + slHTML + '</div>'
                    + '<div class="wl-right">'
                    + '<div class="price" id="wlprice_'+t+'" style="color:'+color+'">'+seedPrice+'</div>'
                    + '<div class="change" id="wlchg_'+t+'" style="color:'+color+'">'+seedChg+'</div>'
                    + '</div>'
                    + '<div class="wl-actions">'
                    + '<button class="alert-btn" onclick="event.stopPropagation();showAlertModal(\''+t+'\')" title="Set alert">\uD83D\uDD14</button>'
                    + '<button class="trash-btn" onclick="event.stopPropagation();removeTicker(\''+t+'\')" title="Remove">\u2715</button>'
                    + '</div>';
                return el;
            }

            window.switchList = function(name,btn){
                currentList = name;
                document.querySelectorAll('.wl-tab').forEach(function(b){b.classList.remove('active');});
                if(btn) btn.classList.add('active');
                // Update persistence note
                var noteEl = document.getElementById('wlPersistText');
                var iconEl = document.getElementById('wlPersistNote') && document.getElementById('wlPersistNote').querySelector('span');
                if (noteEl) {
                    if (name === 'longterm') {
                        noteEl.textContent = 'Synced to your account';
                        if (iconEl) iconEl.style.color = '#089981';
                    } else {
                        noteEl.textContent = 'Saved on this device only';
                        if (iconEl) iconEl.style.color = '#ffd700';
                    }
                }
                renderImmediate();
                fetchPrices();
            };

            async function _fetchCsrf() {
                try {
                    var r = await fetch('/api/csrf-token');
                    var d = await r.json();
                    return d.csrf_token || '';
                } catch(e) { return ''; }
            }

            // ---- ADD: prepend only the new card, auto-remove last if over limit --------
            window.addTicker = async function(){
                var input = document.getElementById('addTickerInput');
                var ticker = input.value.trim().toUpperCase();
                if(!ticker) return;
                document.getElementById('wlDropdown').classList.remove('open');
                input.value = '';

                var list = watchlists[currentList];

                // Duplicate check (local)
                if(list.indexOf(ticker) !== -1){
                    showToast('&#9888; ' + ticker + ' is already in your watchlist', 'warn');
                    return;
                }

                // Save to backend API (requires CSRF token)
                var token = _wlToken();
                if (!token) { showToast('&#9888; Please log in to save watchlist', 'warn'); return; }
                var csrf = await _fetchCsrf();
                try {
                    var res = await fetch('/api/watchlist/add?ticker=' + encodeURIComponent(ticker), {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token, 'X-CSRF-Token': csrf }
                    });
                    if (!res.ok) {
                        var errData = await res.json().catch(function(){ return {}; });
                        showToast('&#9888; ' + (errData.detail || 'Failed to add'), 'warn');
                        return;
                    }
                } catch(e) {
                    showToast('&#9888; Network error adding ticker', 'warn');
                    return;
                }

                // Insert new stock at the FRONT of the array
                list.unshift(ticker);

                // If over limit, remove the LAST stock (oldest)
                if(list.length > MAX_LIMIT){
                    list.pop();
                    showToast('&#9888; Limit reached &ndash; oldest stock removed', 'warn');
                } else {
                    showToast('&#10003; ' + ticker + ' added', 'success');
                }

                updateLimitBar();

                // Re-render all cards in array order (newest first after unshift)
                renderImmediate();
                fetchSinglePrice(ticker);
            };

            // ---- REMOVE: animate-out only that card, no page re-render ------------------------
            window.removeTicker = async function(ticker){
                var token = _wlToken();
                if (token) {
                    var csrf = await _fetchCsrf();
                    try {
                        await fetch('/api/watchlist/remove?ticker=' + encodeURIComponent(ticker), {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + token, 'X-CSRF-Token': csrf }
                        });
                    } catch(e) {}
                }
                watchlists[currentList] = watchlists[currentList].filter(function(t){return t!==ticker;});
                updateLimitBar();

                var card = document.getElementById('wlcard_' + ticker);
                if(card){
                    card.classList.add('wl-card-exit');
                    setTimeout(function(){
                        if(card.parentNode) card.parentNode.removeChild(card);
                        var grid = document.getElementById('watchlistGrid');
                        if(grid && !grid.querySelector('.wl-card')){
                            grid.innerHTML = '<div class="wl-empty"><div class="icon">&#128194;</div><p>Your watchlist is empty. Search and add stocks above.</p></div>';
                        }
                    }, 220);
                }
                showToast('&#10005; ' + ticker + ' removed', '');
            };

            window.openChart = function(ticker){ window.location.href='overview.html?ticker='+ticker; };

            window.showAlertModal = function(ticker){
                alertTicker=ticker;
                document.getElementById('alertTickerLabel').textContent='For '+ticker;
                document.getElementById('alertPrice').value='';
                document.getElementById('alertModal').classList.add('visible');
            };
            window.closeAlertModal = function(){ document.getElementById('alertModal').classList.remove('visible'); };
            window.saveAlert = function(){
                var price=parseFloat(document.getElementById('alertPrice').value);
                var cond=document.getElementById('alertCondition').value;
                if(!price) return;
                alerts.push({ticker:alertTicker,price:price,condition:cond});
                saveAlerts(); closeAlertModal();
            };

            window.setTargets = function(ticker){
                var tp=prompt('Take Profit price for '+ticker+':');
                if(tp){if(!targets[currentList])targets[currentList]={};if(!targets[currentList][ticker])targets[currentList][ticker]={};targets[currentList][ticker].tp=parseFloat(tp);}
                var sl=prompt('Stop Loss price for '+ticker+':');
                if(sl){if(!targets[currentList])targets[currentList]={};if(!targets[currentList][ticker])targets[currentList][ticker]={};targets[currentList][ticker].sl=parseFloat(sl);}
                saveTargets(); fetchPrices();
            };

            // ---- Full render (only used on page load / tab switch) ----------------------------------
            function renderImmediate(){
                var tickers = watchlists[currentList] || [];
                var grid = document.getElementById('watchlistGrid');
                updateLimitBar();
                if(!tickers.length){
                    grid.innerHTML = '<div class="wl-empty"><div class="icon">&#128194;</div><p>Your watchlist is empty. Search and add stocks above.</p></div>';
                    return;
                }
                // Build all cards from scratch (only happens on load or tab switch)
                grid.innerHTML = '';
                tickers.forEach(function(t){
                    grid.appendChild(buildCard(t));
                });
            }

            // ---- Fetch price for a single ticker and update its card ------------------------------
            async function fetchSinglePrice(ticker){
                try {
                    var res = await fetch('/api/live-prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers:[ticker]})});
                    var data = await res.json();
                    updateCardPrice(ticker, data);
                } catch(e){ /* backend offline */ }
            }

            // ---- Update a single card's price elements ----------------------------------------------------------
            function updateCardPrice(t, data){
                var priceEl = document.getElementById('wlprice_'+t);
                var chgEl   = document.getElementById('wlchg_'+t);
                if(!priceEl) return;
                var d = data[t] || {}; var price = d.current || 0; var open = d.open || price;
                var diff = price - open; var pct = open > 0 ? (diff/open)*100 : 0;
                var sign = diff >= 0 ? '+' : '';
                var color = diff >= 0 ? '#089981' : '#f23645';
                var formatted = price > 0 ? price.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : '--';
                priceEl.textContent = '\u20B9' + formatted;
                priceEl.style.color = color;
                chgEl.textContent = price > 0 ? sign+diff.toFixed(2)+' ('+sign+pct.toFixed(2)+'%)' : 'No price data';
                chgEl.style.color = color;
            }

            // ---- Full price refresh &ndash; updates all cards in-place every 5s ------------------
            async function fetchPrices(){
                var tickers = watchlists[currentList] || [];
                if(!tickers.length) return;
                try {
                    var res = await fetch('/api/live-prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers:tickers})});
                    var data = await res.json();
                    tickers.forEach(function(t){ updateCardPrice(t, data); });
                    checkAlerts(data);
                } catch(e){ /* backend offline */ }
            }

            // ---- checkAlerts: uses custom in-page notification, NOT browser alert() ----
            // Fired alerts are immediately removed so they never trigger again.
            function checkAlerts(data){
                var toFire = [];
                var remaining = [];

                alerts.forEach(function(a){
                    var d = data[a.ticker] || {};
                    var price = d.current || 0;
                    var triggered = (a.condition === 'above' && price >= a.price)
                                 || (a.condition === 'below' && price <= a.price);
                    if(triggered && price > 0){
                        toFire.push({ ticker: a.ticker, condition: a.condition, target: a.price, current: price });
                        // Do NOT push back into remaining &ndash; alert is consumed (one-shot)
                    } else {
                        remaining.push(a);
                    }
                });

                if(toFire.length){
                    alerts = remaining;
                    saveAlerts();
                    toFire.forEach(function(f){ showAlertNotif(f); });
                }
            }

            // ---- Show a custom in-page notification card --------------------------------------------------
            function showAlertNotif(f){
                var wrap = document.getElementById('alertNotifWrap');
                if(!wrap) return;
                var id = 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                var isAbove = f.condition === 'above';
                var color = isAbove ? '#089981' : '#f23645';
                var formatted = f.current.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
                var target = f.target.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});

                var card = document.createElement('div');
                card.className = 'alert-notif ' + f.condition;
                card.id = id;
                card.innerHTML =
                    '<div class="notif-top">'
                    + '<span class="notif-badge">&#128276; ALERT TRIGGERED</span>'
                    + '<button class="notif-close" onclick="dismissNotif(\''+id+'\')">&#10005;</button>'
                    + '</div>'
                    + '<div class="notif-ticker">' + f.ticker + '</div>'
                    + '<div class="notif-msg">Price went <strong>' + f.condition + '</strong> your target of <span style="color:'+color+';font-weight:600">&#8377;' + target + '</span></div>'
                    + '<div class="notif-price" style="color:'+color+'">&#8377;' + formatted + '</div>'
                    + '<button class="notif-dismiss" onclick="dismissNotif(\''+id+'\')">&#10003; Got it</button>';

                wrap.appendChild(card);

                // Auto-dismiss after 12 seconds
                setTimeout(function(){ dismissNotif(id); }, 12000);
            }

            window.dismissNotif = function(id){
                var card = document.getElementById(id);
                if(!card) return;
                card.classList.add('alert-notif-exit');
                setTimeout(function(){
                    if(card.parentNode) card.parentNode.removeChild(card);
                }, 260);
            };

            (async function(){
                await loadWatchlists();
                renderImmediate();
                fetchPrices();
            })();
            var _wlInterval = setInterval(fetchPrices, 5000);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) { clearInterval(_wlInterval); _wlInterval = null; }
                else if (!_wlInterval) { _wlInterval = setInterval(fetchPrices, 5000); fetchPrices(); }
            });
        })();
    </script>
    <script src="stocks.js"></script>
    <script src="nav.js?v=9"></script>
</body>
