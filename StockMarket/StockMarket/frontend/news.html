<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - LEVERAGE</title>
    <meta name="description" content="Live Indian stock market news with AI-powered sentiment analysis. Stay updated on Nifty, Sensex, and top stocks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css?v=2">
    <link rel="stylesheet" href="index.css?v=84">
    <link rel="stylesheet" href="nav.css?v=14">
    <style>
        .news-layout{display:grid;grid-template-columns:220px 1fr;gap:1.5rem;}
        .sidebar{display:flex;flex-direction:column;gap:0.25rem;}
        .sidebar-btn{padding:0.6rem 1rem;background:transparent;border:none;color:var(--text-secondary);text-align:left;font-size:0.85rem;font-weight:500;border-radius:8px;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:space-between;}
        .sidebar-btn:hover{background:rgba(255,255,255,0.05);color:#fff;}
        .sidebar-btn.active{background:rgba(74,144,226,0.15);color:#4A90E2;font-weight:600;}
        .featured-headline{background:linear-gradient(135deg,#1a1a2e,#111);border:1px solid rgba(74,144,226,0.2);border-radius:12px;padding:2rem;margin-bottom:1.5rem;cursor:pointer;transition:all 0.2s;position:relative;}
        .featured-headline:hover{border-color:rgba(74,144,226,0.4);}
        .featured-headline h2{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;}
        .featured-headline p{color:var(--text-secondary);font-size:0.9rem;}
        .featured-badge{display:inline-block;padding:3px 10px;background:rgba(8, 153, 129,0.15);color:#089981;border-radius:20px;font-size:0.7rem;font-weight:600;margin-bottom:0.75rem;}
        .source-badge{display:inline-block;padding:2px 8px;background:rgba(74,144,226,0.1);color:#4A90E2;border-radius:4px;font-size:0.7rem;font-weight:600;margin-left:6px;}
        .news-list{display:flex;flex-direction:column;gap:0.75rem;}
        .news-card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:1.25rem;cursor:pointer;transition:all 0.2s;position:relative;}
        .news-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-1px);}
        .news-card .meta{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;font-size:0.75rem;color:var(--text-secondary);}
        .news-card .title{font-size:1rem;font-weight:600;color:#fff;margin-bottom:0.35rem;padding-right:2.5rem;}
        .news-card .excerpt{font-size:0.85rem;color:var(--text-secondary);line-height:1.4;}
        .sentiment-tag{padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:600;}
        .sentiment-bullish{background:rgba(8, 153, 129,0.15);color:#089981;}
        .sentiment-bearish{background:rgba(242, 54, 69,0.15);color:#f23645;}
        .sentiment-neutral{background:rgba(255,255,255,0.1);color:var(--text-secondary);}
        .page-title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;}
        .page-subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem;}
        .search-news{display:flex;gap:0.75rem;margin-bottom:1.5rem;align-items:center;width:100%;}
        .search-input-wrap{position:relative;flex:1;display:flex;align-items:center;}
        .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#71717a;pointer-events:none;}
        .search-news input{
            width:100%;
            height:48px;
            padding:0 2.5rem 0 44px;
            background:#16161a;
            border:1.5px solid rgba(255,255,255,0.12);
            border-radius:12px;
            color:#fff;
            font-family:'Inter',sans-serif;
            font-size:0.95rem;
            outline:none;
            box-sizing:border-box;
            transition:border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .search-news input:focus{
            border-color:var(--accent-blue, #4A90E2);
            box-shadow:0 0 0 3px rgba(74,144,226,0.15);
            background:#1a1a20;
        }
        .search-news input::placeholder{color:#71717a;}
        .clear-search-btn{
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            background:rgba(255,255,255,0.08);
            border:none;
            color:#a1a1aa;
            width:22px;
            height:22px;
            border-radius:50%;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:11px;
            transition:all 0.15s;
        }
        .clear-search-btn:hover{background:rgba(255,255,255,0.18);color:#fff;}
        
        /* Custom Sort Dropdown Component */
        .custom-select-wrapper {
            position: relative;
            width: 185px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .custom-select-trigger {
            width: 100%;
            height: 48px;
            padding: 0 0.95rem;
            background: #16161a;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #fff;
            font-size: 0.86rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .custom-select-trigger:hover,
        .custom-select-wrapper.open .custom-select-trigger {
            border-color: var(--accent-blue, #4A90E2);
            background: #222;
        }
        .custom-select-trigger .chevron-icon {
            width: 13px;
            height: 13px;
            stroke: #a1a1aa;
            transition: transform 0.2s ease;
            flex-shrink: 0;
            pointer-events: none;
        }
        .custom-select-wrapper.open .custom-select-trigger .chevron-icon {
            transform: rotate(180deg);
        }
        .custom-select-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            width: 100%;
            min-width: 175px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: none;
            padding: 4px;
            box-sizing: border-box;
        }
        .custom-select-wrapper.open .custom-select-menu {
            display: block;
        }
        .custom-select-item {
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #d1d1d6;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.12s, color 0.12s;
        }
        .custom-select-item:hover {
            background: rgba(74, 144, 226, 0.15);
            color: #fff;
        }
        .custom-select-item.active {
            background: rgba(74, 144, 226, 0.25);
            color: #4A90E2;
            font-weight: 600;
        }

        .bookmark-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1.1rem;padding:6px;border-radius:6px;transition:all 0.15s;line-height:1;}
        .bookmark-btn:hover{color:#ffd700;background:rgba(255,215,0,0.12);}
        .bookmark-btn.saved{color:#ffd700;}
        .news-loading{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:2.5rem;color:var(--text-secondary);font-size:0.9rem;}
        .spinner{width:18px;height:18px;border:2px solid rgba(74,144,226,0.3);border-top-color:#4A90E2;border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        
        /* ===== MOBILE STYLES (max-width: 768px) ===== */
        @media(max-width:768px){
            .news-layout{
                grid-template-columns:1fr;
                gap:0.75rem;
            }
            /* Sidebar -> horizontal scrollable tab strip */
            .sidebar{
                flex-direction:row;
                overflow-x:auto;
                gap:0.35rem;
                padding:0.25rem 0 0.5rem;
                scrollbar-width:none;
                -webkit-overflow-scrolling:touch;
                border-bottom:1px solid rgba(255,255,255,0.07);
                margin-bottom:0.5rem;
            }
            .sidebar::-webkit-scrollbar{display:none;}
            .sidebar-btn{
                white-space:nowrap;
                padding:0.45rem 0.85rem;
                font-size:0.78rem;
                border-radius:20px;
                background:rgba(255,255,255,0.05);
                border:1px solid rgba(255,255,255,0.08);
                flex-shrink:0;
            }
            .sidebar-btn.active{
                background:rgba(74,144,226,0.18);
                border-color:rgba(74,144,226,0.35);
            }
            /* Bookmarks button - inline on mobile */
            #catBtn-bookmarked{
                border-top:none !important;
                padding-top:0.45rem !important;
                margin-top:0 !important;
            }
            /* Search inputs stack vertically with prominent, large full width */
            .search-news{
                flex-direction:column;
                gap:0.75rem;
                margin-bottom:1.25rem;
                width:100% !important;
            }
            .search-input-wrap{
                width:100% !important;
                flex:none;
            }
            .search-icon{
                left:15px;
                width:20px;
                height:20px;
                color:#94a3b8;
            }
            .search-news input{
                width:100% !important;
                min-width:100% !important;
                max-width:100% !important;
                height:52px !important;
                padding:0 2.5rem 0 46px !important;
                font-size:1rem !important;
                box-sizing:border-box !important;
                border-radius:12px !important;
                background:#16161a !important;
                border:1.5px solid rgba(255,255,255,0.18) !important;
            }
            .custom-select-wrapper{
                width:100% !important;
                max-width:100% !important;
            }
            .custom-select-trigger{
                height:48px !important;
                font-size:0.92rem !important;
                border-radius:12px !important;
                background:#16161a !important;
                border:1.5px solid rgba(255,255,255,0.18) !important;
            }
            .custom-select-menu{
                width:100%;
                left:0;
                right:auto;
            }
            /* Page title compact */
            .page-title{font-size:1.2rem;margin-bottom:0.15rem;}
            .page-subtitle{font-size:0.8rem;margin-bottom:1rem;}
            /* Featured headline compact */
            .featured-headline{
                padding:1rem;
                margin-bottom:1rem;
                border-radius:10px;
            }
            .featured-headline h2{
                font-size:1.05rem;
                line-height:1.4;
                margin-bottom:0.4rem;
            }
            .featured-headline p{font-size:0.8rem;}
            /* News cards */
            .news-card{
                padding:0.9rem;
                border-radius:9px;
            }
            .news-card .title{
                font-size:0.9rem;
                padding-right:2.2rem;
                line-height:1.4;
            }
            .news-card .excerpt{font-size:0.8rem;}
            .news-card .meta{
                flex-wrap:wrap;
                gap:0.4rem;
                font-size:0.72rem;
            }
            .sentiment-tag{font-size:0.68rem;}
            .news-list{gap:0.6rem;}
        }
    </style>

    <script src="ws.js"></script>

<body style="background-color: #0A0A0B;">
    <div id="nav-root"></div>
    <main class="page-content">
        <h1 class="page-title">News</h1>
        <p class="page-subtitle">Market news with AI-powered sentiment analysis &ndash; bookmark what matters</p>
        <div class="search-news">
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="newsSearch" placeholder="Search by ticker or keyword (e.g. SBIN, RELIANCE, budget)..." oninput="window.newsApp.filterNews(this.value)" autocomplete="off">

            </div>
            <div class="custom-select-wrapper" id="sortSelectWrapper">
                <div class="custom-select-trigger" id="sortSelectTrigger" onclick="window.newsApp.toggleSortDropdown(event)">

                </div>

        <div class="news-layout">

                <button class="sidebar-btn" id="catBtn-bearish" onclick="window.newsApp.switchCategory('bearish',this)"><span>📉 Bearish</span></button>
                <button class="sidebar-btn" id="catBtn-earnings" onclick="window.newsApp.switchCategory('earnings',this)"><span>💰 Earnings</span></button>
                <button class="sidebar-btn" id="catBtn-ipo" onclick="window.newsApp.switchCategory('ipo',this)"><span>🏢 IPO</span></button>
                <button class="sidebar-btn" id="catBtn-economy" onclick="window.newsApp.switchCategory('economy',this)"><span>📊 Economy</span></button>
                <button class="sidebar-btn" id="catBtn-bookmarked" onclick="window.newsApp.showBookmarked(this)" style="margin-top:0.5rem;border-top:1px solid rgba(255,255,255,0.06);padding-top:0.75rem;">
                    <span>🔖 Bookmarks</span> <span id="bookmarkCount" style="font-size:0.75rem;color:var(--text-secondary);margin-left:4px;">(0)</span>

                <div class="featured-headline" id="featuredHeadline">

                    <p id="featuredExcerpt">Fetching live data from news sources&hellip;</p>
                </div>

    </main>

    <script>
    // =====================================================================
    //  News Page App – fully self-contained with category fetching, 
    //  custom dropdown filtering, robust bookmark persistence & detail modal
    // =====================================================================
    (function () {
        'use strict';

        var allNews = [];
        var categoryCache = {};
        var currentCategory = 'latest';
        var currentSort = 'newest';
        var bookmarks = [];

        try { 
            var rawBm = JSON.parse(localStorage.getItem('leverage_bookmarks') || '[]');
            if (Array.isArray(rawBm)) {
                bookmarks = rawBm;
            }
        } catch(e) { 
            bookmarks = []; 
        }

        /* ---- Bookmark Helpers ----------------------------------------------------------------------------- */

        function saveBookmarks() {
            try { localStorage.setItem('leverage_bookmarks', JSON.stringify(bookmarks)); } catch(e) {}
            updateBookmarkCount();
        }

        function updateBookmarkCount() {
            var el = document.getElementById('bookmarkCount');
            if (el) el.textContent = '(' + bookmarks.length + ')';
        }

        function _isBookmarked(article) {
            if (!article) return false;
            var artUrl = article.url || '';
            var artTitle = (article.title || '').trim().toLowerCase();
            return bookmarks.some(function (b) {
                if (typeof b === 'string') return b === artUrl;
                if (b && typeof b === 'object') {
                    if (artUrl && b.url && b.url === artUrl) return true;
                    if (artTitle && b.title && b.title.trim().toLowerCase() === artTitle) return true;
                }
                return false;
            });
        }

        function _toggleBookmark(article) {
            if (!article) return;
            var artUrl = article.url || '';
            var artTitle = (article.title || '').trim().toLowerCase();
            var existingIdx = -1;

            for (var i = 0; i < bookmarks.length; i++) {
                var b = bookmarks[i];
                if (typeof b === 'string' && b === artUrl) {
                    existingIdx = i;
                    break;
                } else if (b && typeof b === 'object') {
                    if (artUrl && b.url && b.url === artUrl) { existingIdx = i; break; }
                    if (artTitle && b.title && b.title.trim().toLowerCase() === artTitle) { existingIdx = i; break; }
                }
            }

            if (existingIdx >= 0) {
                bookmarks.splice(existingIdx, 1);
            } else {
                // Store complete article object so bookmarks display anywhere
                bookmarks.unshift({
                    ticker: article.ticker || 'MARKET',
                    title: article.title || '',
                    excerpt: article.excerpt || '',
                    published_at: article.published_at || new Date().toISOString(),
                    sentiment: article.sentiment || { label: 'Bullish', sentiment_score: 0.03 },
                    url: article.url || '',
                    source: article.source || 'ScanX'
                });
            }
            saveBookmarks();
        }

        /* ---- General Helpers ------------------------------------------------------------------------------ */

        function _normaliseSentiment(raw, score) {
            if (!raw) return score != null && score < 0 ? 'Bearish' : 'Bullish';
            var l = (typeof raw === 'string' ? raw : (raw.label || raw.sentiment || '')).toLowerCase();
            if (l === 'positive' || l === 'bullish') return 'Bullish';
            if (l === 'negative' || l === 'bearish') return 'Bearish';
            var s = score != null ? score : (typeof raw === 'object' ? Number(raw.sentiment_score || 0) : 0);
            return s < 0 ? 'Bearish' : 'Bullish';
        }

        function _parseArticleDate(dateStr) {
            if (!dateStr) return 0;
            var t = Date.parse(dateStr);
            if (!isNaN(t)) return t;
            try {
                var d = new Date(dateStr);
                return isNaN(d.getTime()) ? 0 : d.getTime();
            } catch(e) { return 0; }
        }

        function _sortArticles(items, sortMode) {
            var mode = sortMode || currentSort || 'newest';
            var arr = (items || []).slice();
            arr.sort(function (a, b) {
                var da = _parseArticleDate(a.published_at);
                var db = _parseArticleDate(b.published_at);
                if (mode === 'newest') {
                    return db - da;
                } else if (mode === 'oldest') {
                    return da - db;
                } else if (mode === 'bullish') {
                    var sa = (a.sentiment && a.sentiment.sentiment_score != null) ? Number(a.sentiment.sentiment_score) : 0;
                    var sb = (b.sentiment && b.sentiment.sentiment_score != null) ? Number(b.sentiment.sentiment_score) : 0;
                    if (sb !== sa) return sb - sa;
                    return db - da;
                } else if (mode === 'bearish') {
                    var sa = (a.sentiment && a.sentiment.sentiment_score != null) ? Number(a.sentiment.sentiment_score) : 0;
                    var sb = (b.sentiment && b.sentiment.sentiment_score != null) ? Number(b.sentiment.sentiment_score) : 0;
                    if (sa !== sb) return sa - sb;
                    return db - da;
                }
                return db - da;
            });
            return arr;
        }

        function _timeAgo(dateStr) {
            if (!dateStr) return '';
            try {
                var t = _parseArticleDate(dateStr);
                if (!t) return '';
                var sec = Math.floor((Date.now() - t) / 1000);
                if (isNaN(sec)) return '';
                if (sec < 0)    return 'just now';
                if (sec < 60)   return 'just now';
                if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
                if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
                return Math.floor(sec / 86400) + 'd ago';
            } catch(e) { return ''; }
        }

        function _escHtml(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function _cleanTitle(t, excerpt, ticker) {
            var raw = (t || '').trim();
            var clean = raw
                .replace(/\s*[-–|]\s*scanx\.trade\s*$/i, '')
                .trim();
            if (clean.indexOf(' - ') !== -1 || clean.indexOf(' | ') !== -1 || clean.indexOf(' – ') !== -1) {
                var cand = clean.replace(/\s*[-–|]\s*[^–\-|]+$/, '').trim();
                var candWords = cand.split(/\s+/).filter(Boolean);
                if (cand && candWords.length >= 3 && cand.length >= 15) {
                    clean = cand;
                }
            }
            var words = clean.split(/\s+/).filter(Boolean);
            if (words.length <= 1 || clean.length < 10) {
                if (excerpt) {
                    var cleanEx = excerpt.replace(/<[^>]*>/g, '').replace(/&[a-z0-9#]+;/gi, ' ').trim();
                    var exWords = cleanEx.split(/\s+/).filter(Boolean);
                    if (exWords.length >= 4) {
                        var firstSent = cleanEx.split(/[.!?]/)[0].trim();
                        if (firstSent.length >= 15) {
                            return firstSent.length > 95 ? firstSent.slice(0, 95) + '...' : firstSent;
                        }
                        return exWords.slice(0, 12).join(' ') + '...';
                    }
                }
                if (ticker && words.length === 1) {
                    return ticker + ': Latest Market News & Updates';
                }
            }
            return clean || raw || 'Market News & Updates';
        }

        /* ---- Render Functions ----------------------------------------------------------------------------- */

        function renderList(items) {
            var container = document.getElementById('newsContainer');
            if (currentCategory === 'bookmarked' && (!items || items.length === 0)) {
                container.innerHTML = '<div style="color:var(--text-secondary);padding:3.5rem 1rem;text-align:center;"><div style="font-size:2.5rem;margin-bottom:0.75rem;">🔖</div><div style="font-size:1.15rem;font-weight:600;color:#fff;margin-bottom:0.35rem;">No Bookmarked News</div><p style="font-size:0.85rem;color:#888;max-width:380px;margin:0 auto;line-height:1.5;">Click the bookmark icon on any news article card to save it here for quick access anytime.</p></div>';
                return;
            }

            var validItems = (items || []).filter(function(n) {
                var t = _cleanTitle(n.title, n.excerpt, n.ticker);
                return t && t.split(/\s+/).filter(Boolean).length >= 2;
            });

            if (!validItems.length) {
                container.innerHTML = '<div style="color:var(--text-secondary);padding:3rem 1rem;text-align:center;font-size:0.95rem;">No news found for this category. Check back shortly.</div>';
                return;
            }

            // Store globally so openPageNewsDetail can access by index
            window._newsPageArticles = validItems;
            var html = validItems.slice(0, 40).map(function (n, i) {
                var rawSent = n.sentiment;
                var score = (rawSent && rawSent.sentiment_score != null) ? Number(rawSent.sentiment_score) : (typeof n.sentiment_score === 'number' ? n.sentiment_score : 0.03);
                if (isNaN(score) || score === 0) score = 0.03;
                var scoreStr = ' ' + (score > 0 ? '+' : '') + score.toFixed(2);
                var label = _normaliseSentiment(n.sentiment, score);
                var sentClass = label === 'Bullish' ? 'sentiment-bullish' : (label === 'Bearish' ? 'sentiment-bearish' : 'sentiment-neutral');
                var timeAgo = _timeAgo(n.published_at);
                var cleanTitle = _cleanTitle(n.title, n.excerpt, n.ticker);
                var isSaved = _isBookmarked(n);
                return '<div class="news-card" data-news-idx="' + i + '">' +
                    '<div class="meta">' +
                        '<span style="color:var(--accent-blue);font-weight:600;">' + _escHtml(n.ticker || 'MARKET') + '</span>' +
                        (timeAgo ? '<span>' + timeAgo + '</span>' : '') +
                        (label ? '<span class="sentiment-tag ' + sentClass + '">' + label + scoreStr + '</span>' : '') +
                    '</div>' +
                    '<div class="title">' + _escHtml(cleanTitle) + '</div>' +
                    (n.excerpt ? '<div class="excerpt">' + _escHtml(n.excerpt) + '</div>' : '') +
                    '<button class="bookmark-btn' + (isSaved ? ' saved' : '') + '" data-bm-idx="' + i + '" title="' + (isSaved ? 'Remove Bookmark' : 'Bookmark News') + '">🔖</button>' +
                    '</div>';
            }).join('');
            container.innerHTML = html;
        }

        function renderNews() {
            var filtered = allNews || [];
            var cat = currentCategory;

            if (cat === 'bullish') {
                var pool = categoryCache['latest'] || allNews;
                filtered = pool.filter(function (n) {
                    return _normaliseSentiment(n.sentiment) === 'Bullish';
                });
            } else if (cat === 'bearish') {
                var pool = categoryCache['latest'] || allNews;
                filtered = pool.filter(function (n) {
                    return _normaliseSentiment(n.sentiment) === 'Bearish';
                });
            } else if (cat === 'earnings') {
                filtered = categoryCache['earnings'] || allNews;
            } else if (cat === 'ipo') {
                filtered = categoryCache['ipo'] || allNews;
            } else if (cat === 'economy') {
                filtered = categoryCache['economy'] || allNews;
            } else if (cat === 'bookmarked') {
                filtered = bookmarks.map(function(b) {
                    if (typeof b === 'object' && b !== null && b.title) return b;
                    var found = allNews.find(function(a) { return a.url === b; });
                    return found || { title: b, url: b, excerpt: '', ticker: 'SAVED', published_at: '' };
                });
            }

            var searchInp = document.getElementById('newsSearch');
            var q = searchInp ? searchInp.value.trim().toLowerCase() : '';
            if (q && cat === 'bookmarked') {
                filtered = filtered.filter(function(n) {
                    var t = ((n.title || '') + ' ' + (n.excerpt || '') + ' ' + (n.ticker || '')).toLowerCase();
                    return t.includes(q);
                });
            }

            var sorted = _sortArticles(filtered, currentSort);
            renderList(sorted);
        }

        /* ---- Detail Modal --------------------------------------------------------------------------------- */

        function openPageNewsDetail(idx) {
            var items = window._newsPageArticles || [];
            var n = items[idx];
            if (!n) return;
            var score = (n.sentiment && n.sentiment.sentiment_score != null) ? Number(n.sentiment.sentiment_score) : 0.03;
            if (isNaN(score) || score === 0) score = 0.03;
            var label = _normaliseSentiment(n.sentiment, score);
            var sentColor = label === 'Bullish' ? '#089981' : (label === 'Bearish' ? '#f23645' : '#a1a1aa');
            var sentEmoji = label === 'Bullish' ? '📈' : (label === 'Bearish' ? '📉' : '🎯');
            var scoreStr = ' ' + (score > 0 ? '+' : '') + score.toFixed(2);
            var summary = _escHtml(n.excerpt || n.summary || n.snippet || 'No additional details available.');
            var cleanTitle = _cleanTitle(n.title);

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
            overlay.setAttribute('tabindex', '-1');

            var modal = document.createElement('div');
            modal.style.cssText = 'background:#111;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:2rem;max-width:620px;width:90%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.6);';

            var linkUrl = n.url && n.url !== '#' ? n.url : (n.ticker ? 'overview.html?ticker=' + encodeURIComponent(n.ticker) : null);
            var readMoreBtn = linkUrl ? '<a href="' + _escHtml(linkUrl) + '" target="_blank" rel="noopener" style="padding:0.6rem 1.5rem;background:#4A90E2;border-radius:8px;color:#fff;font-size:0.85rem;text-decoration:none;font-weight:600;">Read Full Article &rarr;</a>' : '';
            var closeId = 'newsDetailClose_' + Date.now();
            modal.innerHTML =
                '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">' +
                    '<div style="font-size:0.8rem;color:' + sentColor + ';background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:20px;font-weight:600;">' + sentEmoji + ' ' + label + scoreStr + '</div>' +
                    (n.ticker && n.ticker !== 'MARKET' ? '<div style="font-size:0.8rem;color:#4A90E2;font-weight:600;padding:4px 12px;background:rgba(74,144,226,0.1);border-radius:20px;">' + _escHtml(n.ticker) + '</div>' : '') +
                '</div>' +
                '<h2 style="font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:0.75rem;line-height:1.45;">' + _escHtml(cleanTitle) + '</h2>' +
                '<div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem;color:#a1a1aa;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,0.06);">' +
                    '<span>' + (n.published_at ? new Date(n.published_at).toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'}) : '') + '</span>' +
                '</div>' +
                '<div style="font-size:0.95rem;color:#d1d1d6;line-height:1.75;">' + summary + '</div>' +
                '<div style="display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;">' +
                    readMoreBtn +
                    '<button id="' + closeId + '" style="padding:0.6rem 1.5rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;cursor:pointer;font-size:0.85rem;">Close</button>' +
                '</div>';

            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            overlay.focus();

            overlay.addEventListener('click', function (e) { if (e.target === overlay) document.body.removeChild(overlay); });
            overlay.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.removeChild(overlay); });
            document.getElementById(closeId).addEventListener('click', function () { document.body.removeChild(overlay); });
        }

        window.openPageNewsDetail = openPageNewsDetail;

        /* ---- Event Delegation for news cards -------------------------------------------------------------- */

        document.addEventListener('click', function (e) {
            // Bookmark button click
            var bmBtn = e.target.closest('.bookmark-btn');
            if (bmBtn) {
                e.stopPropagation();
                var idx = parseInt(bmBtn.getAttribute('data-bm-idx'), 10);
                var items = window._newsPageArticles || [];
                var article = items[idx];
                if (article) {
                    _toggleBookmark(article);
                    if (currentCategory === 'bookmarked') {
                        renderNews();
                    } else {
                        var isSaved = _isBookmarked(article);
                        if (isSaved) bmBtn.classList.add('saved');
                        else bmBtn.classList.remove('saved');
                    }
                }
                return;
            }

            // News card click -> open detail
            var card = e.target.closest('.news-card[data-news-idx]');
            if (card) {
                var idx = parseInt(card.getAttribute('data-news-idx'), 10);
                if (!isNaN(idx)) openPageNewsDetail(idx);
                return;
            }

            // Close sort dropdown if clicked outside
            var sortWrapper = document.getElementById('sortSelectWrapper');
            if (sortWrapper && !sortWrapper.contains(e.target)) {
                sortWrapper.classList.remove('open');
            }
        });

        /* ---- Data Fetching -------------------------------------------------------------------------------- */

        function _normaliseArticle(a, defaultSource) {
            var rawSent = a.sentiment || {};
            var sentScore = 0.0;
            if (typeof rawSent === 'object' && rawSent.sentiment_score != null) {
                sentScore = Number(rawSent.sentiment_score);
            } else if (typeof a.sentiment_score === 'number') {
                sentScore = a.sentiment_score;
            }
            if (isNaN(sentScore)) sentScore = 0.0;
            var displayScore = sentScore === 0.0 ? 0.03 : sentScore;
            var label = _normaliseSentiment(a.sentiment, displayScore);
            return {
                ticker: a.ticker || a.symbol || 'MARKET',
                title: a.title || a.headline || '',
                excerpt: a.excerpt || a.snippet || a.summary || '',
                published_at: a.published_at || a.pubDate || a.published || new Date().toISOString(),
                sentiment: { label: label, sentiment_score: displayScore },
                url: a.url || a.link || '',
                source: (a.source || defaultSource || 'ScanX').replace(/scanx\.trade/i, 'ScanX')
            };
        }

        async function fetchNewsAPI(query, customSignal) {
            try {
                var resp = await fetch('/api/news/search/' + encodeURIComponent(query), customSignal ? { signal: customSignal } : {});
                var data = resp.ok ? await resp.json() : [];
                return (Array.isArray(data) ? data : []).map(function(a) {
                    return _normaliseArticle(a, 'ScanX');
                });
            } catch(e) {
                if (e.name === 'AbortError') throw e;
                console.error('Fetch news error for query=' + query, e);
                return [];
            }
        }

        async function loadCategoryNews(query, catKey) {
            var container = document.getElementById('newsContainer');
            var articles = await fetchNewsAPI(query);
            if (articles.length > 0) {
                categoryCache[catKey] = articles;
                if (currentCategory === catKey || (catKey === 'latest' && (currentCategory === 'latest' || currentCategory === 'bullish' || currentCategory === 'bearish'))) {
                    allNews = articles;
                    renderNews();
                    if (catKey === 'latest') {
                        var first = allNews[0];
                        var fTitle = document.getElementById('featuredTitle');
                        var fExcerpt = document.getElementById('featuredExcerpt');
                        if (fTitle) fTitle.textContent = _cleanTitle(first.title);
                        if (fExcerpt) fExcerpt.textContent = first.excerpt || '';
                        if (first.url) {
                            var fHead = document.getElementById('featuredHeadline');
                            if (fHead) fHead.onclick = function() { window.open(first.url, '_blank'); };
                        }
                    }
                }
            } else {
                if (currentCategory === catKey && container) {
                    container.innerHTML = '<div style="color:var(--text-secondary);padding:3rem 1rem;text-align:center;">No ' + catKey + ' news found currently. Please try again shortly.</div>';
                }
            }
        }

        /* ---- Public API on window.newsApp ----------------------------------------------------------------- */

        window.newsApp = {
            toggleSortDropdown: function(e) {
                if (e) e.stopPropagation();
                var wrapper = document.getElementById('sortSelectWrapper');
                if (wrapper) wrapper.classList.toggle('open');
            },
            selectSort: function(val, labelText, el) {
                currentSort = val || 'newest';
                var currentLabel = document.getElementById('sortSelectCurrent');
                if (currentLabel) currentLabel.textContent = labelText;
                document.querySelectorAll('#sortSelectMenu .custom-select-item').forEach(function(item) {
                    item.classList.remove('active');
                });
                if (el) el.classList.add('active');
                var wrapper = document.getElementById('sortSelectWrapper');
                if (wrapper) wrapper.classList.remove('open');
                renderNews();
            },
            switchCategory: async function (cat, btn) {
                currentCategory = cat;
                document.querySelectorAll('.sidebar-btn').forEach(function (b) { b.classList.remove('active'); });
                if (btn) btn.classList.add('active');

                var featured = document.getElementById('featuredHeadline');
                var container = document.getElementById('newsContainer');

                if (cat === 'bookmarked') {
                    if (featured) featured.style.display = 'none';
                    renderNews();
                    return;
                }

                if (cat === 'latest' || cat === 'bullish' || cat === 'bearish') {
                    if (featured && !document.getElementById('newsSearch')?.value?.trim()) featured.style.display = 'block';
                    if (categoryCache['latest'] && categoryCache['latest'].length) {
                        allNews = categoryCache['latest'];
                        renderNews();
                    } else {
                        if (container) container.innerHTML = '<div class="news-loading"><div class="spinner"></div> Loading live news&hellip;</div>';
                        await loadCategoryNews('market', 'latest');
                    }
                    return;
                }

                // Dedicated categories: earnings, ipo, economy
                if (featured) featured.style.display = 'none';
                if (categoryCache[cat] && categoryCache[cat].length) {
                    allNews = categoryCache[cat];
                    renderNews();
                } else {
                    if (container) container.innerHTML = '<div class="news-loading"><div class="spinner"></div> Loading ' + cat.toUpperCase() + ' news&hellip;</div>';
                    await loadCategoryNews(cat, cat);
                }
            },
            showBookmarked: function (btn) {
                this.switchCategory('bookmarked', btn);
            },
            filterNewsTimeout: null,
            searchAbortController: null,
            currentSearchId: 0,
            clearSearch: function() {
                var inp = document.getElementById('newsSearch');
                if (inp) {
                    inp.value = '';
                    inp.focus();
                }
                this.filterNews('');
            },
            filterNews: function (q) {
                var self = this;
                if (self.filterNewsTimeout) {
                    clearTimeout(self.filterNewsTimeout);
                }
                
                var clearBtn = document.getElementById('clearNewsSearch');
                if (clearBtn) {
                    clearBtn.style.display = (q && q.trim()) ? 'flex' : 'none';
                }

                self.filterNewsTimeout = setTimeout(async function() {
                    var searchVal = (q || '').trim();
                    if (searchVal.toLowerCase() === 'relience') searchVal = 'RELIANCE';
                    
                    var query = searchVal.toUpperCase();
                    var featured = document.getElementById('featuredHeadline');
                    var container = document.getElementById('newsContainer');
                    
                    if (!query) {
                        if (self.searchAbortController) {
                            try { self.searchAbortController.abort(); } catch(e){}
                        }
                        self.currentSearchId++;
                        if (currentCategory === 'latest' && featured) featured.style.display = 'block';
                        self.switchCategory(currentCategory, document.getElementById('catBtn-' + currentCategory));
                        return;
                    }
                    
                    if (featured) featured.style.display = 'none';
                    
                    if (currentCategory === 'bookmarked') {
                        renderNews();
                        return;
                    }
                    
                    if (self.searchAbortController) {
                        try { self.searchAbortController.abort(); } catch(e){}
                    }
                    self.searchAbortController = new AbortController();
                    var thisReqSignal = self.searchAbortController.signal;
                    var thisReqId = ++self.currentSearchId;
                    
                    if (container) {
                        container.innerHTML = '<div style="padding:4rem 1rem;text-align:center;color:#4A90E2;"><div style="width:38px;height:38px;border:3px solid rgba(74,144,226,0.2);border-top-color:#4A90E2;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div><div style="font-size:1.05rem;font-weight:600;">Searching live news for "' + _escHtml(query) + '"...</div></div>';
                    }
                    
                    try {
                        var articles = await fetchNewsAPI(query, thisReqSignal);
                        
                        // Discard result if newer search request was initiated while waiting
                        if (thisReqId !== self.currentSearchId) {
                            return;
                        }
                        var currentSearchInput = (document.getElementById('newsSearch')?.value || '').trim().toUpperCase();
                        if (currentSearchInput !== query && currentSearchInput !== searchVal.toUpperCase()) {
                            return;
                        }

                        if (articles.length > 0) {
                            allNews = articles;
                            renderNews();
                        } else {
                            if (container) {
                                container.innerHTML = '<div style="padding:3.5rem 1rem;text-align:center;color:#a1a1aa;"><div style="font-size:1.75rem;margin-bottom:0.75rem;">🔍</div><div style="font-size:1.05rem;font-weight:600;color:#fff;margin-bottom:0.3rem;">No news found for "' + _escHtml(query) + '"</div><div style="font-size:0.85rem;color:#71717a;">Try searching with a different ticker (e.g. SBIN, RELIANCE, TCS).</div></div>';
                            }
                        }
                    } catch(e) {
                        if (e.name !== 'AbortError' && thisReqId === self.currentSearchId) {
                            if (container) {
                                container.innerHTML = '<div style="padding:3.5rem 1rem;text-align:center;color:#f23645;"><div style="font-size:1.75rem;margin-bottom:0.75rem;">⚠️</div><div style="font-size:1.05rem;font-weight:600;margin-bottom:0.3rem;">Failed to fetch news</div><div style="font-size:0.85rem;color:#a1a1aa;">Please check your connection or try again.</div></div>';
                            }
                        }
                    }
                }, 280);
            }
        };

        /* ---- Initialization -------------------------------------------------------------------------------- */

        updateBookmarkCount();

        var urlParams = new URLSearchParams(window.location.search);
        var initialTicker = urlParams.get('ticker') || urlParams.get('q') || urlParams.get('symbol');
        if (initialTicker) {
            var searchInp = document.getElementById('newsSearch');
            if (searchInp) searchInp.value = initialTicker;
            window.newsApp.filterNews(initialTicker);
        } else {
            loadCategoryNews('market', 'latest');
        }

        var _newsInterval = setInterval(function() {
            if (!document.getElementById('newsSearch')?.value?.trim() && currentCategory === 'latest') {
                loadCategoryNews('market', 'latest');
            }
        }, 60000);

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                clearInterval(_newsInterval);
                _newsInterval = null;
            } else if (!_newsInterval) {
                _newsInterval = setInterval(function() {
                    if (!document.getElementById('newsSearch')?.value?.trim() && currentCategory === 'latest') {
                        loadCategoryNews('market', 'latest');
                    }
                }, 60000);
            }
        });

    })();
    </script>
    <script src="stocks.js"></script>
    <script src="nav.js?v=9"></script>
</body>
