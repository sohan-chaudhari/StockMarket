<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks - LEVERAGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <style>
        :root{--text-secondary:#a1a1aa;--accent-blue:#4A90E2;--font-ui:'Inter',sans-serif;}
        body{background-color:#0A0A0B;color:#ffffff;font-family:'Inter',sans-serif;}
        .stocks-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;}
        .stocks-card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:1.5rem;}
        .stocks-card.full{grid-column:1/-1;}
        .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
        .card-header h3{font-size:1.1rem;font-weight:600;color:#fff;}
        .stock-row{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 0;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s;}
        .stock-row:hover{background:rgba(255,255,255,0.03);margin:0 -0.5rem;padding:0.65rem 0.5rem;border-radius:6px;}
        .stock-row:last-child{border-bottom:none;}
        .stock-left{display:flex;align-items:center;gap:10px;}
        .stock-rank{font-size:0.75rem;color:var(--text-secondary);font-weight:500;min-width:20px;}
        .stock-info h4{font-size:0.85rem;font-weight:600;color:#fff;margin:0;}
        .stock-info p{font-size:0.75rem;color:var(--text-secondary);margin:0;}
        .stock-right{text-align:right;}
        .stock-price{font-family:'Roboto Mono',monospace;font-size:0.9rem;font-weight:600;}
        .stock-change{font-family:'Roboto Mono',monospace;font-size:0.8rem;font-weight:500;}
        .text-green{color:#00E676;}.text-red{color:#FF0055;}
        .filters-bar{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.5rem;padding:1rem;background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;align-items:flex-end;}
        .filter-group{display:flex;flex-direction:column;gap:4px;}
        .filter-group label{font-size:0.7rem;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
        .filter-select{background:#1a1a1a;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:6px;font-size:0.8rem;font-family:var(--font-ui);outline:none;cursor:pointer;}
        .filter-select:focus{border-color:var(--accent-blue);}
        .view-toggle{display:flex;gap:4px;background:#1a1a1a;border-radius:6px;padding:2px;margin-left:auto;}
        .view-btn{padding:4px 10px;border:none;background:none;color:var(--text-secondary);cursor:pointer;border-radius:4px;font-size:0.8rem;font-family:var(--font-ui);}
        .view-btn.active{background:#333;color:#fff;}
        .section-title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;}
        .section-subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:1.5rem;}
        .badge{font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:600;}
        .badge-blue{background:rgba(74,144,226,0.15);color:#4A90E2;}
        .badge-green{background:rgba(0,230,118,0.15);color:#00E676;}
        .badge-red{background:rgba(255,0,85,0.15);color:#FF0055;}
        .stock-logo-mini{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--accent-blue);flex-shrink:0;}
        .grid-view{display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
        .grid-view.active{display:grid;}
        .list-view{display:block;}
        .list-view.hidden{display:none;}
        .stock-card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:1.25rem;cursor:pointer;transition:all 0.2s;}
        .stock-card:hover{border-color:rgba(74,144,226,0.3);transform:translateY(-2px);}
        .stock-card h4{font-size:0.95rem;font-weight:600;color:#fff;margin:0 0 4px 0;}
        .stock-card .meta{font-size:0.7rem;color:var(--text-secondary);margin-bottom:0.75rem;}
        .stock-card .big-price{font-size:1.4rem;font-weight:700;font-family:'Roboto Mono',monospace;}
        .stock-card .chg{font-size:0.85rem;font-weight:600;font-family:'Roboto Mono',monospace;margin-top:4px;}
        @media(max-width:768px){.stocks-grid{grid-template-columns:1fr;}}
    </style>
    <script src="page-cache.js"></script>
</head>
<body>
    <div id="nav-root"></div>
    <main class="page-content">
        <h1 class="section-title">Stocks</h1>
        <p class="section-subtitle">Discover and screen stocks — click any to view chart</p>
        <div class="filters-bar" id="filtersBar">
            <div class="filter-group"><label>Sector</label><select class="filter-select" id="filterSector" onchange="applyFilters()"><option value="">All Sectors</option><option>Banking</option><option>IT</option><option>Pharma</option><option>Auto</option><option>FMCG</option><option>Energy</option><option>Metal</option><option>Realty</option></select></div>
            <div class="filter-group"><label>Market Cap</label><select class="filter-select" id="filterCap" onchange="applyFilters()"><option value="">All</option><option>Large Cap</option><option>Mid Cap</option><option>Small Cap</option></select></div>
            <div class="filter-group"><label>Price Range</label><select class="filter-select" id="filterPrice" onchange="applyFilters()"><option value="">All</option><option>Under ₹50</option><option>₹50 - ₹200</option><option>₹200 - ₹1000</option><option>Above ₹1000</option></select></div>
            <div class="filter-group"><label>PE Ratio</label><select class="filter-select" id="filterPE" onchange="applyFilters()"><option value="">Any</option><option>Under 15</option><option>15 - 30</option><option>30 - 50</option><option>Above 50</option></select></div>
            <div class="view-toggle"><button class="view-btn active" onclick="toggleView('list',this)">List</button><button class="view-btn" onclick="toggleView('grid',this)">Grid</button></div>
        </div>
        <div class="stocks-grid">
            <div class="stocks-card"><div class="card-header"><h3>📈 Top Gainers</h3><span class="badge badge-green">Today</span></div><div class="list-view" id="gainersList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="gainersGrid"></div></div>
            <div class="stocks-card"><div class="card-header"><h3>📉 Top Losers</h3><span class="badge badge-red">Today</span></div><div class="list-view" id="losersList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="losersGrid"></div></div>
            <div class="stocks-card"><div class="card-header"><h3>🔥 Most Active</h3><span class="badge badge-blue">Volume</span></div><div class="list-view" id="activeList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="activeGrid"></div></div>
            <div class="stocks-card"><div class="card-header"><h3>⚡ Volume Shockers</h3><span class="badge badge-blue">Surge</span></div><div class="list-view" id="shockersList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="shockersGrid"></div></div>
            <div class="stocks-card"><div class="card-header"><h3>💥 Breakout Stocks</h3><span class="badge badge-green">Momentum</span></div><div class="list-view" id="breakoutList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="breakoutGrid"></div></div>
            <div class="stocks-card"><div class="card-header"><h3>🔥 Trending</h3><span class="badge badge-blue">Most Searched</span></div><div class="list-view" id="trendingList"><div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">Loading...</div></div><div class="grid-view" id="trendingGrid"></div></div>
        </div>
    </main>
    <script>
        (function(){
            // ── Stock metadata: sector, market cap, approximate PE ──────────────
            var STOCK_META = {
                'RELIANCE':    { sector:'Energy',     cap:'Large Cap', pe:28 },
                'TCS':         { sector:'IT',         cap:'Large Cap', pe:32 },
                'HDFCBANK':    { sector:'Banking',    cap:'Large Cap', pe:18 },
                'INFY':        { sector:'IT',         cap:'Large Cap', pe:25 },
                'ICICIBANK':   { sector:'Banking',    cap:'Large Cap', pe:17 },
                'BHARTIARTL':  { sector:'Telecom',    cap:'Large Cap', pe:55 },
                'SBIN':        { sector:'Banking',    cap:'Large Cap', pe:10 },
                'HINDUNILVR':  { sector:'FMCG',       cap:'Large Cap', pe:58 },
                'ITC':         { sector:'FMCG',       cap:'Large Cap', pe:27 },
                'LT':          { sector:'Industrials',cap:'Large Cap', pe:33 },
                'KOTAKBANK':   { sector:'Banking',    cap:'Large Cap', pe:20 },
                'AXISBANK':    { sector:'Banking',    cap:'Large Cap', pe:14 },
                'ASIANPAINT':  { sector:'Consumer Durables', cap:'Large Cap', pe:60 },
                'MARUTI':      { sector:'Auto',       cap:'Large Cap', pe:30 },
                'WIPRO':       { sector:'IT',         cap:'Large Cap', pe:22 },
                'TITAN':       { sector:'Consumer Durables', cap:'Large Cap', pe:90 },
                'SUNPHARMA':   { sector:'Pharma',     cap:'Large Cap', pe:35 },
                'BAJFINANCE':  { sector:'Banking',    cap:'Large Cap', pe:38 },
                'ADANIENT':    { sector:'Energy',     cap:'Large Cap', pe:65 },
                'TATAMOTORS':  { sector:'Auto',       cap:'Large Cap', pe:8  },
                'NTPC':        { sector:'Power',      cap:'Large Cap', pe:14 },
                'ONGC':        { sector:'Oil & Gas',  cap:'Large Cap', pe:7  },
                'POWERGRID':   { sector:'Power',      cap:'Large Cap', pe:16 },
                'ULTRACEMCO':  { sector:'Metal',      cap:'Large Cap', pe:42 },
                'TATASTEEL':   { sector:'Metal',      cap:'Large Cap', pe:12 },
                'JSWSTEEL':    { sector:'Metal',      cap:'Large Cap', pe:15 },
                'TECHM':       { sector:'IT',         cap:'Mid Cap',   pe:28 },
                'HAL':         { sector:'Industrials',cap:'Large Cap', pe:45 },
                'BEL':         { sector:'Industrials',cap:'Mid Cap',   pe:52 },
                'ZOMATO':      { sector:'Technology', cap:'Mid Cap',   pe:220 },
            };

            var viewMode = 'list'; var allEntries = [];

            function getInitials(t){return t.substring(0,2);}

            window.applyFilters = function(){ renderAll(); };

            window.toggleView = function(mode,btn){
                viewMode = mode; document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active');
                document.querySelectorAll('.list-view').forEach(function(el){el.style.display = mode==='list'?'block':'none';});
                document.querySelectorAll('.grid-view').forEach(function(el){el.style.display = mode==='grid'?'grid':'none';});
            };

            async function fetchAll(){
                try {
                    var res = await fetch('/api/market-movers');
                    var marketData = await res.json();
                    var allTickers = [];
                    function addT(t){ if(t && allTickers.indexOf(t)===-1) allTickers.push(t); }
                    (marketData.gainers||[]).forEach(function(s){ addT(s.ticker); });
                    (marketData.losers||[]).forEach(function(s){ addT(s.ticker); });
                    (marketData.most_active||[]).forEach(function(s){ addT(s.ticker); });

                    var liveData = {};
                    try {
                        var lr = await fetch('/api/live-prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers:allTickers})});
                        if(lr.ok) liveData = await lr.json();
                    } catch(e){}

                    allEntries = allTickers.map(function(t){
                        var item = null;
                        (marketData.gainers||[]).concat(marketData.losers||[]).concat(marketData.most_active||[]).forEach(function(s){ if(s&&s.ticker===t) item=s; });
                        if(!item) return null;
                        var live = liveData[t];
                        var price = (live&&live.current!=null) ? live.current : (item.current_price||0);
                        var prevClose = (live&&live.prev_close!=null) ? live.prev_close : (item.prev_close || price);
                        var diff = price - prevClose;
                        var pct = prevClose>0 ? (diff/prevClose)*100 : 0;
                        var meta = STOCK_META[t] || {};
                        return { ticker:t, price:price, diff:diff, pct:pct, volume:item.volume||0,
                                 volume_display:item.volume_display||'', sector:meta.sector||'', cap:meta.cap||'', pe:meta.pe||0 };
                    }).filter(function(x){return x!==null;});

                    renderAll();
                } catch(e){
                    var msg = '<div style="color:var(--text-secondary);padding:1rem;text-align:center;">Backend server needed</div>';
                    ['gainersList','losersList','activeList','shockersList','breakoutList','trendingList'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=msg;});
                }
            }

            function renderAll(){
                var filtered = allEntries.slice();

                var sector = document.getElementById('filterSector').value;
                if(sector) filtered = filtered.filter(function(e){ return e.sector === sector; });
                var cap = document.getElementById('filterCap').value;
                if(cap) filtered = filtered.filter(function(e){ return e.cap === cap; });
                var priceRange = document.getElementById('filterPrice').value;
                if(priceRange === 'Under ₹50')         filtered = filtered.filter(function(e){ return e.price > 0 && e.price < 50; });
                else if(priceRange === '₹50 - ₹200')   filtered = filtered.filter(function(e){ return e.price >= 50 && e.price <= 200; });
                else if(priceRange === '₹200 - ₹1000') filtered = filtered.filter(function(e){ return e.price > 200 && e.price <= 1000; });
                else if(priceRange === 'Above ₹1000')  filtered = filtered.filter(function(e){ return e.price > 1000; });
                var pe = document.getElementById('filterPE').value;
                if(pe === 'Under 15')   filtered = filtered.filter(function(e){ return e.pe > 0 && e.pe < 15; });
                else if(pe === '15 - 30') filtered = filtered.filter(function(e){ return e.pe >= 15 && e.pe <= 30; });
                else if(pe === '30 - 50') filtered = filtered.filter(function(e){ return e.pe > 30 && e.pe <= 50; });
                else if(pe === 'Above 50') filtered = filtered.filter(function(e){ return e.pe > 50; });

                var gainers  = filtered.filter(function(e){return e.pct>0;}).sort(function(a,b){return b.pct-a.pct;}).slice(0,7);
                var losers   = filtered.filter(function(e){return e.pct<0;}).sort(function(a,b){return a.pct-b.pct;}).slice(0,7);
                var active   = filtered.slice().sort(function(a,b){return b.volume-a.volume;}).slice(0,7);
                var shockers = filtered.slice().sort(function(a,b){return Math.abs(b.pct)-Math.abs(a.pct);}).slice(0,7);
                var breakouts= filtered.filter(function(e){return e.pct>0.5;}).sort(function(a,b){return b.pct-a.pct;}).slice(0,7);
                var trending = filtered.slice().sort(function(a,b){return b.volume-a.volume;}).slice(0,7);

                renderBoth('gainers',gainers,'text-green'); renderBoth('losers',losers,'text-red');
                renderBoth('active',active,'text-green');   renderBoth('shockers',shockers,'badge-blue');
                renderBoth('breakout',breakouts,'text-green'); renderBoth('trending',trending,'badge-blue');
            }

            function renderBoth(prefix,items,colorClass){
                renderList(prefix+'List',items,colorClass); renderGrid(prefix+'Grid',items,colorClass);
            }

            function renderList(containerId,items,colorClass){
                var container = document.getElementById(containerId); if(!container) return;
                if(!items||!items.length){container.innerHTML='<div style="color:var(--text-secondary);padding:1rem 0;text-align:center;">No data</div>';return;}
                var isActive = containerId.indexOf('active') !== -1;
                container.innerHTML = items.map(function(item,i){
                    var sign=item.diff>=0?'+':''; var cls=item.diff>=0?'text-green':'text-red';
                    var extra = isActive ? '<span style="font-size:0.7rem;color:var(--text-secondary);margin-top:2px;">Vol: '+(item.volume_display||'--')+'</span>' : '';
                    return '<div class="stock-row" onclick="window.location.href=\'stock.html?ticker='+item.ticker+'\'"><div class="stock-left"><span class="stock-rank">'+(i+1)+'</span><div class="stock-logo-mini">'+getInitials(item.ticker)+'</div><div class="stock-info"><h4>'+item.ticker+'</h4><p>NSE</p>'+extra+'</div></div><div class="stock-right"><div class="stock-price">\u20B9'+item.price.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div class="stock-change '+cls+'">'+sign+item.diff.toFixed(2)+' ('+sign+item.pct.toFixed(2)+'%)</div></div></div>';
                }).join('');
            }

            function renderGrid(containerId,items,colorClass){
                var container = document.getElementById(containerId); if(!container) return;
                if(!items||!items.length){container.innerHTML='';return;}
                var isActive = containerId.indexOf('active') !== -1;
                container.innerHTML = items.map(function(item){
                    var sign=item.diff>=0?'+':''; var cls=item.diff>=0?'text-green':'text-red';
                    var extra = isActive ? '<div style="font-size:0.7rem;color:var(--text-secondary);margin-top:4px;">Vol: '+(item.volume_display||'--')+'</div>' : '';
                    return '<div class="stock-card" onclick="window.location.href=\'stock.html?ticker='+item.ticker+'\'"><h4>'+item.ticker+'</h4><div class="meta">NSE</div><div class="big-price" style="color:'+(item.diff>=0?'#00E676':'#FF0055')+'">\u20B9'+item.price.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div class="chg '+cls+'">'+sign+item.diff.toFixed(2)+' ('+sign+item.pct.toFixed(2)+'%)</div>'+extra+'</div>';
                }).join('');
            }

            fetchAll(); var _stInterval = setInterval(fetchAll, 10000);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) { clearInterval(_stInterval); _stInterval = null; }
                else if (!_stInterval) { _stInterval = setInterval(fetchAll, 10000); fetchAll(); }
            });
            toggleView('list',document.querySelector('.view-btn'));
        })();
    </script>
    <script src="stocks.js"></script>
    <script src="nav.js?v=3"></script>
</body>
</html>
