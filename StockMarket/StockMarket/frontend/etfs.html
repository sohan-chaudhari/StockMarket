<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETFs - LEVERAGE</title>
    <link rel="stylesheet" href="tokens.css?v=2">
    <link rel="stylesheet" href="index.css?v=84">
    <link rel="stylesheet" href="nav.css?v=14">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #0A0A0B; color: #fff; font-family: 'Inter', sans-serif; }
        .page-content { max-width: 1400px; margin: 0 auto; padding: 4rem 2rem; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .page-subtitle { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 2rem; }
        .etf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .etf-card { background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 1.25rem; cursor: pointer; transition: border-color 0.15s; }
        .etf-card:hover { border-color: rgba(74,144,226,0.3); }
        .etf-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
        .etf-ticker { font-size: 0.75rem; color: #4A90E2; margin-bottom: 8px; }
        .etf-price { font-family: 'Roboto Mono', monospace; font-size: 1.2rem; font-weight: 700; }
        .etf-change { font-family: 'Roboto Mono', monospace; font-size: 0.85rem; }
        .text-green { color: #089981; } .text-red { color: #f23645; }
        .category-tag { display: inline-block; padding: 2px 8px; background: rgba(255,255,255,0.06); border-radius: 10px; font-size: 0.7rem; color: #a1a1aa; margin-top: 6px; }
    </style>
    <script src="page-cache.js?v=4"></script>
    <script src="ws.js"></script>
</head>
<body>
    <div id="nav-root"></div>
    <main class="page-content">
        <h1 class="page-title">Exchange Traded Funds</h1>
        <p class="page-subtitle">Popular ETFs tracking major indices and sectors</p>
        <div class="etf-grid" id="etfContainer">
            <div style="grid-column:1/-1;text-align:center;color:var(--text-secondary);padding:3rem;">Loading ETF data...</div>
        </div>
    </main>
    <script>
        var ETFs = [
            {ticker:'NIFTYBEES',name:'Nippon India ETF Nifty 50 BeES',category:'Index'},
            {ticker:'JUNIORBEES',name:'Nippon India ETF Junior BeES',category:'Index'},
            {ticker:'BANKBEES',name:'Nippon India ETF Bank BeES',category:'Banking'},
            {ticker:'MON100',name:'Motilal Oswal Nasdaq 100 ETF',category:'Global'},
            {ticker:'HNGSNGBEES',name:'Hang Seng BeES ETF',category:'Global'},
            {ticker:'CONSUMBEES',name:'Nippon India ETF Consumption',category:'Consumption'},
            {ticker:'PSUBANKBEES',name:'Nippon India ETF PSU Bank BeES',category:'PSU Banking'},
            {ticker:'GOLDBEES',name:'Nippon India ETF Gold BeES',category:'Gold'},
            {ticker:'SILVERBEES',name:'Nippon India ETF Silver BeES',category:'Silver'},
            {ticker:'LIQUIDBEES',name:'Nippon India ETF Liquid BeES',category:'Liquid'},
            {ticker:'MOM100',name:'Motilal Oswal Momentum 100 ETF',category:'Momentum'},
            {ticker:'ALPHA50',name:'Motilal Oswal Alpha 50 ETF',category:'Alpha'},
            {ticker:'ITBEES',name:'Nippon India ETF IT BeES',category:'IT'},
            {ticker:'PHARMABEES',name:'Nippon India ETF Pharma BeES',category:'Pharma'},
            {ticker:'HEALTHY',name:'Nippon India ETF Healthcare',category:'Healthcare'},
        ];

        async function loadETFs(){
            try{
                var res = await fetch('/api/live-prices', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({tickers: ETFs.map(function(e){return e.ticker;})})
                });
                var data = await res.json();
                var container = document.getElementById('etfContainer');
                container.innerHTML = ETFs.map(function(e){
                    var d = data[e.ticker] || {};
                    var price = d.current || 0;
                    var prev = d.prev_close || d.open || price;
                    var diff = price - prev;
                    var pct = prev>0 ? (diff/prev)*100 : 0;
                    var cls = diff>=0 ? 'text-green' : 'text-red';
                    var sign = diff>=0 ? '+' : '';
                    return '<div class="etf-card" onclick="window.location.href=\'overview.html?ticker='+e.ticker+'\'">' +
                        '<div class="etf-name">'+e.name+'</div>' +
                        '<div class="etf-ticker">'+e.ticker+' <span class="category-tag">'+e.category+'</span></div>' +
                        '<div class="etf-price">'+(price?'\u20B9'+price.toFixed(2):'--')+'</div>' +
                        '<div class="etf-change '+cls+'">'+(diff?sign+diff.toFixed(2)+' ('+sign+pct.toFixed(2)+'%)':'')+'</div>' +
                        '</div>';
                }).join('');
            }catch(e){
                document.getElementById('etfContainer').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-secondary);padding:3rem;">Start backend server</div>';
            }
        }
        loadETFs();
    </script>
    <script src="stocks.js"></script>
    <script src="nav.js?v=9"></script>
</body>
</html>
