<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Price Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .stock-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .ticker {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00C853;
        }
        .price {
            font-size: 2rem;
            margin: 0.5rem 0;
        }
        .change {
            font-size: 1.2rem;
        }
        .positive { color: #00C853; }
        .negative { color: #FF5252; }
        .status {
            background: #333;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            font-family: monospace;
        }
    </style>
    <script src="page-cache.js"></script>
    <script src="ws.js"></script>
</head>
<body>
    <h1>🔴 Live Price Test Page</h1>
    <div class="status" id="status">Connecting to backend...</div>
    
    <div id="stocks"></div>

    <script>
        const TICKERS = ['NIFTY', 'BANKNIFTY', 'SENSEX', 'RELIANCE', 'TCS'];
        const stocksDiv = document.getElementById('stocks');
        const statusDiv = document.getElementById('status');

        async function updatePrices() {
            try {
                const response = await fetch('http://127.0.0.1:8003/api/live-prices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tickers: TICKERS })
                });

                if (!response.ok) {
                    statusDiv.textContent = `&#10060; Error: ${response.status}`;
                    return;
                }

                const data = await response.json();
                statusDiv.textContent = `&#9989; Connected | Last update: ${new Date().toLocaleTimeString()}`;
                
                console.log('Live prices:', data);

                stocksDiv.innerHTML = TICKERS.map(ticker => {
                    const priceData = data[ticker];
                    
                    if (!priceData) {
                        return `
                            <div class="stock-card">
                                <div class="ticker">${ticker}</div>
                                <div>&#9888;️ No data received</div>
                            </div>
                        `;
                    }

                    const current = priceData.current || 0;
                    const open = priceData.open || current;
                    const change = current - open;
                    const changePct = open > 0 ? (change / open * 100) : 0;
                    const isPositive = change >= 0;

                    return `
                        <div class="stock-card">
                            <div class="ticker">${ticker}</div>
                            <div class="price">&#8377;${current.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                            <div class="change ${isPositive ? 'positive' : 'negative'}">
                                ${isPositive ? '▲' : '▼'} ${isPositive ? '+' : ''}${change.toFixed(2)} (${isPositive ? '+' : ''}${changePct.toFixed(2)}%)
                            </div>
                            <div style="color: #888; font-size: 0.9rem; margin-top: 0.5rem;">
                                Open: &#8377;${open.toFixed(2)}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                statusDiv.textContent = `&#10060; Error: ${error.message}`;
                console.error('Update failed:', error);
            }
        }

        // Update immediately and then every 2 seconds
        updatePrices();
        setInterval(updatePrices, 2000);
    </script>
</body>
</html>
