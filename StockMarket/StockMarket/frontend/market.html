  <style>
    /* Header layout &ndash; market.html previously had no flex/positioning rules for this at all
       (that logic only lived inside stock.html's own page-scoped styles), so header-controls
       and the ticker-identity row never actually laid out or wrapped correctly at any width. */
    .sticky-header-container{display:flex;flex-direction:column;gap:10px;padding:12px 15px;background:var(--bg-color);border-bottom:1px solid rgba(255,255,255,0.08);}
    .header-controls{display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap;}
    .back-btn{color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;padding:6px 12px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:all 0.2s;}
    .back-btn:hover{background:rgba(255,255,255,0.1);color:var(--text-primary);}
    .header-identity{display:flex;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap;gap:10px;}
    .ticker-branding{display:flex;align-items:center;flex-wrap:wrap;gap:12px;}

    .market-stats-grid{display:grid;grid-template-columns:1fr 2fr;gap:1rem;margin:1.5rem 0;}
    .market-stat-card{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-md);padding:1.25rem;}
    .market-stat-card .lbl{font-size:0.75rem;color:var(--text-secondary);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.5px;}
    .market-stat-card .val{font-size:1.2rem;font-weight:600;font-family:'Roboto Mono',monospace;}
    /* Day Range replaces the old Open/High/Low/Volume tiles, which just repeated the
       O/H/L/Vol numbers already shown in the header row above. This shows the same
       high/low as a range visual instead &ndash; genuinely new information, not a repeat. */
    .day-range-bar{display:flex;align-items:center;gap:10px;margin-top:6px;}
    .day-range-bar .dr-label{font-family:'Roboto Mono',monospace;font-size:0.85rem;color:var(--text-secondary);white-space:nowrap;}
    .day-range-track{position:relative;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--danger),#52525b,var(--success));}
    .day-range-marker{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--card-bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(255,255,255,0.25);transition:left 0.3s ease;}
    .market-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-bottom:2rem;}
    .market-detail-card{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-md);padding:1.5rem;}
    .market-detail-card h3{font-size:1rem;font-weight:600;margin-bottom:1rem;color:var(--text-primary);}
    /* Renamed from .mover-row: that name collided with index.css's own richer .mover-row
       (used by the dashboard's movers), producing an unintended, un-designed hybrid style. */
    .mover-row-d{display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85rem;}
    .mover-row-d:last-child{border-bottom:none;}
    .loading-place{padding:1rem;text-align:center;color:var(--text-secondary);}
    .text-green{color:var(--success);}.text-red{color:var(--danger);}
    /* Range dropdown replaces the old 11-button row: that wrapped to 2-3 lines on mobile
       and each button was ~20-24px tall, under the ~40-44px touch-target convention used
       elsewhere in the app (chart toolbar, stock.html header buttons). */
    .header-controls{position:relative;z-index:1000;}.range-dropdown{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:var(--radius-sm);background:transparent;color:var(--text-primary);font-size:13px;font-weight:600;font-family:var(--font-ui);cursor:pointer;transition:all 0.15s;z-index:1001;}
    .range-dropdown:hover{border-color:var(--accent-blue);}
    .range-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:140px;background:var(--card-bg);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:999999 !important;display:none;overflow:hidden;}
    .range-menu.visible{display:block;}
    .range-item{min-height:40px;display:flex;align-items:center;padding:0 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:background 0.15s,color 0.15s;}
    .range-item:hover{background:rgba(255,255,255,0.06);color:var(--text-primary);}
    .range-item.active{background:var(--accent-blue);color:#fff;}
    /* #chart-container had no height anywhere in the cascade &ndash; it relied entirely on the
       ResizeObserver in the inline script firing before layout, which is unreliable: measured
       it collapsing to 0px in one load and 30px in another. An explicit height makes the chart
       always render at a real, usable size regardless of that timing. */
    #chart-container{height:500px;}
    @media(max-width:768px){
      .market-stats-grid{grid-template-columns:repeat(2,1fr);}
      .market-detail-grid{grid-template-columns:1fr;}
      .header-identity{flex-direction:column;align-items:flex-start;}
      #chart-container{height:350px;}
    }
  </style>

</head>

  <script>
  (function(){
    var ticker = new URLSearchParams(window.location.search).get('ticker') || 'NIFTY';
    // Badge previously repeated the ticker name a 2nd time, and the line below repeated
    // it a 3rd time as "<ticker> - INDEX" &ndash; three identical labels stacked on top of
    // each other. Badge now shows the instrument type, the line below shows the exchange.
    var EXCHANGE_BY_TICKER = {SENSEX:'BSE'};
    document.getElementById('ticker-name').textContent = ticker;
    document.getElementById('ticker-badge').textContent = 'INDEX';
    document.getElementById('ticker-symbol-small').textContent = EXCHANGE_BY_TICKER[ticker] || 'NSE';
    document.title = ticker + ' - Market - LEVERAGE';
    var chart = null, candleSeries = null;

    function fmt(p){ if(p==null)return '--'; return Number(p).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function fmtL(n){ if(n==null)return '--'; if(n>=10000000)return (n/10000000).toFixed(2)+' Cr'; if(n>=100000)return (n/100000).toFixed(2)+' L'; return Number(n).toLocaleString('en-IN'); }

    function updateDayRange(low, high, current){
      var lowEl = document.getElementById('dayRangeLow');
      var highEl = document.getElementById('dayRangeHigh');
      var marker = document.getElementById('dayRangeMarker');
      var validLow = (low != null && low > 0);
      var validHigh = (high != null && high > 0);
      if (validLow && lowEl) lowEl.textContent = fmt(low);
      if (validHigh && highEl) highEl.textContent = fmt(high);
      if (validLow && validHigh && marker && current != null) {
        var pct = high > low ? ((current - low) / (high - low)) * 100 : 50;
        pct = Math.max(0, Math.min(100, pct));
        marker.style.left = pct + '%';
      }
    }

    window.toggleRangeMenu = function(){
      var menu = document.getElementById('rangeMenu');
      if (menu) menu.classList.toggle('visible');
    };
    window.selectRange = function(range){
      var menu = document.getElementById('rangeMenu');
      if (menu) menu.classList.remove('visible');
      loadData(range);
    };
    document.addEventListener('click', function(e){
      if (!e.target.closest('.range-dropdown')) {
        var rm = document.getElementById('rangeMenu');
        if (rm) rm.classList.remove('visible');
      }
    });

    var loader = document.getElementById('leverage-loader');

    function initChart(){
      var c = document.getElementById('chart');
      if(!c) return;
      chart = LightweightCharts.createChart(c, {
        layout:{background:{type:'solid',color:'#0A0A0B'},textColor:'#d1d4dc'},
        grid:{vertLines:{color:'rgba(42,46,57,0.5)'},horzLines:{color:'rgba(42,46,57,0.5)'}},
        crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
        rightPriceScale:{borderColor:'rgba(197,203,206,0.8)'},
        timeScale:{borderColor:'rgba(197,203,206,0.8)',timeVisible:true,rightOffset:40,fixLeftEdge:false},
      });
      candleSeries = chart.addCandlestickSeries({
        upColor:'#26a69a',downColor:'#ef5350',
        borderDownColor:'#ef5350',borderUpColor:'#26a69a',
        wickDownColor:'#ef5350',wickUpColor:'#26a69a',
      });
      var chartContainer = document.getElementById('chart-container');
      if(!chartContainer) chartContainer = c;
      new ResizeObserver(function(e){
        if(e.length===0)return;
        var r=e[0].contentRect;
        chart.applyOptions({height:r.height,width:r.width});
      }).observe(chartContainer);
    }

    function syncRangeUI(range){
      document.querySelectorAll('.range-item').forEach(function(b){b.classList.remove('active');});
      var itm = document.querySelector('.range-item[data-range="'+range+'"]');
      if(itm) itm.classList.add('active');
      var crt = document.getElementById('currentRangeText');
      if(crt) crt.textContent = range;
    }

    window.loadData = async function(range){
      if(!candleSeries) return;
      if(loader) loader.style.display='flex';

      if(_loadController) try{_loadController.abort();}catch(e){}
      var myLoadId = ++_loadId;
      _loadController = new AbortController();
      var signal = _loadController.signal;

      var cacheInterval = range;
      if(range==='1D') cacheInterval='5m';
      else if(range==='1W') cacheInterval='15m';
      var memKey = ticker+'|'+cacheInterval+'|'+range;
      var memData = window._recentRanges ? window._recentRanges.get(memKey) : null;
      if(memData){ renderChartCached(memData,range); syncRangeUI(range); if(loader)loader.style.display='none'; return; }

      if(window._idbGetCandles){
        var idbData = await window._idbGetCandles(ticker, cacheInterval, range);
        if(idbData){
          if(window._recentRanges) window._recentRanges.set(memKey, idbData);
          renderChartCached(idbData,range);
          syncRangeUI(range);
          if(loader)loader.style.display='none';
          return;
        }
      }

      try{
        var url = "/api/stock-data/range?ticker="+encodeURIComponent(ticker)+"&range="+range;
        if(range==='1D') url = "/api/stock-data/intraday?ticker="+encodeURIComponent(ticker)+"&interval=5m";
        else if(range==='1W') url = "/api/stock-data/intraday?ticker="+encodeURIComponent(ticker)+"&interval=15m";
        else if(range==='5m'||range==='15m'||range==='30m'||range==='1h') url = "/api/stock-data/intraday?ticker="+encodeURIComponent(ticker)+"&interval="+range;

        var res = await fetch(url, {signal:signal});
        if(myLoadId!==_loadId){if(loader)loader.style.display='none';return;}
        if (!res.ok) { throw new Error('HTTP ' + res.status + ' for ' + range + ' data'); }
        var data = await res.json();

        if(myLoadId!==_loadId){if(loader)loader.style.display='none';return;}

        syncRangeUI(range);

        if(Array.isArray(data)&&data.length>0){
          renderChartCached(data,range);
        }
        window._loadedRange = range;
        // Write to caches on successful API fetch
        try{
          if(window._recentRanges) window._recentRanges.set(memKey, data);
          if(window._idbSetCandles) window._idbSetCandles(ticker, cacheInterval, range, data);
        }catch(e){}
      }catch(e){
        if(e.name==='AbortError'){if(loader)loader.style.display='none';return;}
        console.error('Chart error:',e);
      }
      finally{if(loader) loader.style.display='none';}
    };

    var _chartDataCache = null, _earliestLoadedTime = null, _isLoadingMore = false, _lazyLoadSubscribed = false;
    var _loadId = 0, _loadController = null;

    function _setupLazyLoad(){
      if(!chart||_lazyLoadSubscribed)return;
      _lazyLoadSubscribed=true;
      chart.timeScale().subscribeVisibleTimeRangeChange(function(){
        if(_isLoadingMore)return;
        var r=window._loadedRange;
        if(!r||!_earliestLoadedTime)return;
        var tr=chart.timeScale().getVisibleRange();
        if(!tr)return;
        var im={'5m':300,'15m':900,'30m':1800,'1h':3600};
        var ts=im[r];
        var buf=ts?ts*10:86400*5;
        if(tr.from>=_earliestLoadedTime+buf)return;
        _fetchMoreData(_earliestLoadedTime,r);
      });
    }

    function _fetchMoreData(beforeTime,range){
      _isLoadingMore=true;
      var isIntraday=['5m','15m','30m','1h'].indexOf(range)!==-1;
      var url;
      if(isIntraday){
        url='/api/stock-data/intraday/paginated?ticker='+encodeURIComponent(ticker)+'&interval='+range+'&before='+beforeTime+'&limit=200';
      }else{
        var beforeDate=new Date(beforeTime*1000).toISOString().split('T')[0];
        url='/api/stock-data/range/paginated?ticker='+encodeURIComponent(ticker)+'&range='+range+'&before='+beforeDate+'&limit=200';
      }
      fetch(url).then(function(r){return r.json();}).then(function(resp){
        if(resp&&resp.data&&resp.data.length>0){
          var incoming=resp.data.map(function(p){
            var t=toTimeNum(p.time); if(t==null)return null;
            return {time:Math.floor(t),open:p.open,high:p.high,low:p.low,close:p.close};
          }).filter(function(p){return p!=null;});
          var combined=_chartDataCache? _chartDataCache.slice():[];
          var et={};
          combined.forEach(function(c){et[c.time]=true;});
          incoming.forEach(function(c){if(!et[c.time]){combined.push(c);et[c.time]=true;}});
          combined.sort(function(a,b){return a.time-b.time;});
          _chartDataCache=combined;
          _earliestLoadedTime=combined.length>0?combined[0].time:null;
          candleSeries.setData(combined);
          chart.timeScale().scrollToPosition(0,false);
        }
        _isLoadingMore=false;
      }).catch(function(){_isLoadingMore=false;});
    }

    function toTimeNum(v){
      if(v==null)return 0;
      if(typeof v==='number')return v;
      if(typeof v==='string'){
        var n=Number(v);if(!isNaN(n))return n;
        if(/^\d{4}-\d{2}-\d{2}$/.test(v)){var ms=new Date(v+'T00:00:00Z').getTime();return isNaN(ms)?0:Math.floor(ms/1000);}
        var ms=new Date(v).getTime();return isNaN(ms)?0:Math.floor(ms/1000);
      }
      return 0;
    }

    function renderChartCached(data,range){
      var f = data.filter(function(p) { 
        return p.open > 0 && p.high > 0 && p.low > 0 && p.close > 0; 
      }).map(function(p){
        var t = toTimeNum(p.time);
        if(t==null)return null;
        return {time:Math.floor(t),open:p.open,high:p.high,low:p.low,close:p.close};
      }).filter(function(p){return p!=null&&p.time!=null;});
      f.sort(function(a,b){ return a.time-b.time; });
      var u=[],seen=new Set();
      f.forEach(function(p){if(!seen.has(p.time)){seen.add(p.time);u.push(p);}});
      _chartDataCache = u.slice();
      _earliestLoadedTime = u.length>0 ? u[0].time : null;
      candleSeries.setData(u);
      _setupLazyLoad();
      if (u.length > 200 && range !== 'ALL' && range !== '1Y' && range !== '6M') {
        var endIdx = u.length - 1;
        var startIdx = Math.max(0, endIdx - 150);
        chart.timeScale().setVisibleLogicalRange({ from: startIdx, to: endIdx });
      } else {
        chart.timeScale().fitContent();
      }
    }

    async function fetchLive(){
      try{
        var res = await fetch('/api/live-prices',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({tickers:[ticker]})
        });
        var data = await res.json();
        if(data&&data[ticker]){
          var d=data[ticker], p=d.current||0, prev=d.prev_close||d.open||p;
          var diff=p-prev, pct=prev>0?(diff/prev)*100:0;
          var cls=diff>=0?'text-green':'text-red', sn=diff>=0?'+':'';
          document.getElementById('header-price').textContent = fmt(p);
          document.getElementById('header-price').style.color = diff>=0?'#089981':'#f23645';
          var chg = document.getElementById('header-change');
          chg.textContent = sn+diff.toFixed(2)+' ('+sn+pct.toFixed(2)+'%)';
          chg.style.color = diff>=0?'#089981':'#f23645';
          document.getElementById('statPrevClose').textContent = fmt(prev);
          // Sync OHLC header from live data &ndash; only overwrite when valid (>0)
          // to preserve chart-candle values when source (e.g. AngelOne WS
          // for indices) doesn't provide daily open/high/low.
          if (d.open != null && d.open > 0) {
            document.getElementById('ohlc-open').textContent = fmt(d.open);
          }
          if (d.high != null && d.high > 0) {
            document.getElementById('ohlc-high').textContent = fmt(d.high);
          }
          if (d.low != null && d.low > 0) {
            document.getElementById('ohlc-low').textContent = fmt(d.low);
          }
          document.getElementById('ohlc-close').textContent = fmt(p);
          var mktVol = document.getElementById('ohlc-volume');
          if (mktVol && d.volume != null) mktVol.textContent = fmtL(d.volume);
          updateDayRange(d.low, d.high, p);
          // Update sector tag from live-prices response
          var secEl = document.getElementById('sector-tag');
          if (secEl && d.sector) {
            var secText = d.sector;
            if (d.sectorPct != null) {
              var secSn = d.sectorPct >= 0 ? '+' : '';
              secText += ' (' + secSn + d.sectorPct.toFixed(2) + '%)';
            }
            secEl.textContent = secText;
            secEl.style.display = 'inline-block';
            secEl.style.color = d.sectorPct >= 0 ? '#26a69a' : '#ef5350';
          } else if (secEl) {
            secEl.style.display = 'none';
          }
        }
      }catch(e){console.error('Live error:',e);}
    }

    async function renderMovers(){
      try{
        var fetchPromise = window._fetchCached ? window._fetchCached('/api/market-movers', 30000) : fetch('/api/market-movers').then(r=>r.json());
        var data = await fetchPromise;
        if (!data) return;
        var gainers = (data.gainers||[]).slice(0, 8);
        var losers = (data.losers||[]).slice(0, 8);
        var active = (data.most_active||[]).slice(0, 8);
        var allTickers = [];
        gainers.concat(losers).concat(active).forEach(function(s){
          if(s && s.ticker && allTickers.indexOf(s.ticker)===-1) allTickers.push(s.ticker);
        });
        var liveData = {};
        try {
          var lr = await fetch('/api/live-prices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers:allTickers})});
          if(lr.ok) liveData = await lr.json();
        } catch(e){}

        function refine(list){
          return list.filter(Boolean).map(function(s){
            var live = liveData[s.ticker];
            var curr = (live&&live.current!=null) ? live.current : s.current_price;
            var prev = (live&&live.prev_close!=null) ? live.prev_close : (s.prev_close || curr);
            var chg = prev>0 ? (curr-prev)/prev*100 : (s.change_pct||0);
            var vol = (live&&live.volume!=null) ? live.volume : s.volume;
            return {ticker:s.ticker, chg:chg, volume:vol, volume_display:s.volume_display};
          });
        }

        renderMoverColumn('topGainers', refine(gainers), 'pct');
        renderMoverColumn('topLosers', refine(losers), 'pct');
        renderMoverColumn('mostActive', refine(active), 'vol');
      }catch(e){
        ['topGainers','topLosers','mostActive'].forEach(function(id){
          var el = document.getElementById(id);
          if (el) el.innerHTML = '<div class="loading-place">Unable to load market data right now</div>';
        });
      }
    }

    function getTickerColor(ticker) {
      var colors = ['#1e88e5','#43a047','#e53935','#8e24aa','#fb8c00','#00acc1','#3949ab','#d81b60','#00897b','#5e35b1'];
      var hash = 0;
      for (var i = 0; i < (ticker||'').length; i++) hash = (hash * 31 + ticker.charCodeAt(i)) & 0xffffffff;
      return colors[Math.abs(hash) % colors.length];
    }

    function renderTickerLogo(ticker, size) {
      size = size || 24;
      var clean = (ticker || '').toUpperCase().trim();
      var initials = clean.slice(0, 2);
      var bg = getTickerColor(clean);
      var logoUrl = 'logos/' + encodeURIComponent(clean) + '.svg';
      return '<div class="stock-logo-mini" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:#ffffff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,0.08);padding:1px;box-sizing:border-box;flex-shrink:0;">' +
          '<img src="' + logoUrl + '" alt="' + clean + '" style="width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;" onerror="this.onerror=null;this.parentElement.style.background=\'' + bg + '\';this.parentElement.style.color=\'#ffffff\';this.parentElement.innerHTML=\'<span style=\\\'font-size:' + Math.round(size*0.38) + 'px;font-weight:700;\\\'>' + initials + '</span>\';">' +
          '</div>';
    }

    function renderMoverColumn(containerId, list, metric){
      var el = document.getElementById(containerId);
      if (!el) return;
      if (!list.length) { el.innerHTML = '<div class="loading-place">No data available</div>'; return; }
      el.innerHTML = list.map(function(x){
        var cls = x.chg>=0 ? 'text-green' : 'text-red';
        var sn = x.chg>=0 ? '+' : '';
        var right = metric === 'vol' ? (x.volume_display || fmtL(x.volume||0)) : (sn+x.chg.toFixed(2)+'%');
        var rightAttr = metric === 'vol' ? '' : ' class="'+cls+'"';
        var logo = renderTickerLogo(x.ticker, 22);
        return '<div class="mover-row-d" style="cursor:pointer;" onclick="window.location.href=\'overview.html?ticker='+x.ticker+'\'"><div style="display:flex;align-items:center;gap:8px;">'+logo+'<span style="font-weight:500;color:#fff;">'+x.ticker+'</span></div><span'+rightAttr+'>'+right+'</span></div>';
      }).join('');
    }

    function seedUIFromCache() {
      try {
        var raw = localStorage.getItem('llp');
        if (!raw) return;
        var ts = parseInt(localStorage.getItem('llp_ts') || '0', 10);
        if (Date.now() - ts > 600000) return; // 10-min TTL
        var data = JSON.parse(raw);
        var d = data[ticker];
        if (!d || !d.current) return;
        var p = d.current; var prev = d.prev_close || d.open || p;
        var diff = p - prev; var pct = prev > 0 ? (diff / prev) * 100 : 0;
        var cls = diff >= 0 ? '#089981' : '#f23645'; var sn = diff >= 0 ? '+' : '';
        document.getElementById('header-price').textContent = fmt(p);
        document.getElementById('header-price').style.color = cls;
        var chg = document.getElementById('header-change');
        chg.textContent = sn + diff.toFixed(2) + ' (' + sn + pct.toFixed(2) + '%)';
        chg.style.color = cls;
        document.getElementById('statPrevClose').textContent = fmt(prev);
        updateDayRange(d.low, d.high, p);
      } catch(e) {}
    }

    function updateMarketStatusUI() {
      var el = document.getElementById('ws-status');
      if (!el) return;
      if (window._marketOpen) {
        el.textContent = '&#9679; Live';
        el.style.color = '#26a69a';
      } else {
        el.textContent = '&#9679; Closed';
        el.style.color = '#ef5350';
      }
    }

    async function refreshMarketStatus() {
      try {
        var r = await fetch('/api/market-movers');
        var d = await r.json();
        window._marketOpen = d.market_open === true;
      } catch (e) { window._marketOpen = false; }
      updateMarketStatusUI();
    }

    initChart();
    seedUIFromCache();
    loadData('ALL');
    fetchLive();
    renderMovers();
    refreshMarketStatus();
    var _intFetch = setInterval(fetchLive, 15000);
    var _intMovers = setInterval(renderMovers, 30000);
    var _intStatus = setInterval(refreshMarketStatus, 60000);
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            clearInterval(_intFetch); _intFetch = null;
            clearInterval(_intMovers); _intMovers = null;
            clearInterval(_intStatus); _intStatus = null;
        } else {
            if (!_intFetch) { _intFetch = setInterval(fetchLive, 15000); fetchLive(); }
            if (!_intMovers) { _intMovers = setInterval(renderMovers, 30000); renderMovers(); }
            if (!_intStatus) { _intStatus = setInterval(refreshMarketStatus, 60000); refreshMarketStatus(); }
        }
    });
    
    // Listen for WebSocket price updates to update UI instantly
    window.addEventListener('dashboard_price_update', function(evt) {
      var raw = evt.detail;
      if (!raw) return;
      var prices = raw.prices || raw;

      // Update main chart ticker
      var d = prices[ticker];
      if (d && d.current != null) {
        var p = d.current;
        var prev = (d.prev_close != null && d.prev_close > 0) ? d.prev_close : ((d.open != null && d.open > 0) ? d.open : p);
        var diff = p - prev;
        var pct = (prev > 0) ? (diff / prev) * 100 : 0;
        var sn = diff >= 0 ? '+' : '';
        document.getElementById('header-price').textContent = fmt(p);
        document.getElementById('header-price').style.color = diff>=0?'#089981':'#f23645';
        var chg = document.getElementById('header-change');
        if (chg) {
          chg.textContent = sn+diff.toFixed(2)+' ('+sn+pct.toFixed(2)+'%)';
          chg.style.color = diff>=0?'#089981':'#f23645';
        }
        if (d.open != null && d.open > 0) {
          document.getElementById('ohlc-open').textContent = fmt(d.open);
        }
        if (d.high != null && d.high > 0) {
          document.getElementById('ohlc-high').textContent = fmt(d.high);
        }
        if (d.low != null && d.low > 0) {
          document.getElementById('ohlc-low').textContent = fmt(d.low);
        }
        var ohlcC = document.getElementById('ohlc-close');
        if (ohlcC) ohlcC.textContent = fmt(p);
        var mktVol2 = document.getElementById('ohlc-volume');
        if (mktVol2 && d.volume != null) mktVol2.textContent = fmtL(d.volume);
        updateDayRange(d.low, d.high, p);
        document.getElementById('statPrevClose').textContent = fmt(prev);
        
        // Update live chart candle
        if (typeof candleSeries !== 'undefined' && candleSeries) {
          var activeRange = window._loadedRange || '1D';
          var isIntraday = ['1m','5m','15m','30m','1h'].indexOf(activeRange) !== -1;
          if (isIntraday) {
            var intervalMin = {'1m':1, '5m':5, '15m':15, '30m':30, '1h':60}[activeRange];
            var ms = intervalMin * 60 * 1000;
            var now = new Date();
            var utcMs = now.getTime();
            var IST_OFFSET_MS = 5.5 * 3600 * 1000;
            var SESSION_START_MIN = 9 * 60 + 15;
            
            var istDayStartMs = (Math.floor((utcMs + IST_OFFSET_MS) / 86400000) * 86400000) - IST_OFFSET_MS;
            var sessionStartMs = istDayStartMs + SESSION_START_MIN * 60000;
            var offsetFromSession = utcMs - sessionStartMs;
            var snappedMs = offsetFromSession < 0 ? sessionStartMs : sessionStartMs + Math.floor(offsetFromSession / ms) * ms;
            var snappedSec = Math.floor(snappedMs / 1000);
            
            if (!window._formingCandle || window._formingCandle.time !== snappedSec) {
              var fallbackC = (_chartDataCache && _chartDataCache.length > 0) ? _chartDataCache[_chartDataCache.length - 1].close : p;
              var openPrice = (d.current > 0) ? d.current : (window._formingCandle ? window._formingCandle.close : fallbackC);
              window._formingCandle = { time: snappedSec, open: openPrice, high: Math.max(openPrice, p), low: Math.min(openPrice, p), close: p };
            } else {
              window._formingCandle.high = Math.max(window._formingCandle.high, p);
              window._formingCandle.low = Math.min(window._formingCandle.low, p);
              window._formingCandle.close = p;
            }
            try { candleSeries.update(window._formingCandle); } catch(e) {}
          } else {
            // Daily / non-intraday ticking
            var nowIST = new Date(Date.now() + 5.5 * 3600 * 1000);
            var dayStr = nowIST.getUTCFullYear() + '-' + String(nowIST.getUTCMonth()+1).padStart(2,'0') + '-' + String(nowIST.getUTCDate()).padStart(2,'0');
            var snappedSec = Math.floor(new Date(dayStr + 'T00:00:00Z').getTime() / 1000);
            
            // For 1W/1M, we can just update the last historical candle if we are inside it
            if (activeRange !== '1D' && _chartDataCache && _chartDataCache.length > 0) {
                var lastTime = _chartDataCache[_chartDataCache.length - 1].time;
                if (snappedSec >= lastTime) snappedSec = lastTime;
            }
            
            if (!window._formingCandle || window._formingCandle.time !== snappedSec) {
              var fallbackC = (_chartDataCache && _chartDataCache.length > 0) ? _chartDataCache[_chartDataCache.length - 1].close : p;
              var openPrice = (d.current > 0) ? d.current : (window._formingCandle ? window._formingCandle.close : fallbackC);
              window._formingCandle = { time: snappedSec, open: openPrice, high: Math.max(openPrice, p), low: Math.min(openPrice, p), close: p };
            } else {
              window._formingCandle.high = Math.max(window._formingCandle.high, p);
              window._formingCandle.low = Math.min(window._formingCandle.low, p);
              window._formingCandle.close = p;
            }
            try { candleSeries.update(window._formingCandle); } catch(e) {}
          }
        }
        
        var secEl = document.getElementById('sector-tag');
        if (secEl && d.sector) {
          var secText = d.sector;
          if (d.sectorPct != null) {
            var secSn = d.sectorPct >= 0 ? '+' : '';
            secText += ' (' + secSn + d.sectorPct.toFixed(2) + '%)';
          }
          secEl.textContent = secText;
          secEl.style.display = 'inline-block';
          secEl.style.color = d.sectorPct >= 0 ? '#26a69a' : '#ef5350';
        }
      }
    });
    
    // Start WebSocket
    if (window.DashboardWS) {
      window.DashboardWS.start([ticker, 'NIFTY', 'BANKNIFTY', 'SENSEX', 'FINNIFTY', 'MIDCAP']);
    }
  })();
  </script>
</body>
