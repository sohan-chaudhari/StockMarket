<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview - LEVERAGE</title>
  <script src="page-cache.js?v=4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css?v=2">
  <link rel="stylesheet" href="index.css?v=85">
  <link rel="stylesheet" href="nav.css?v=14">
  <link rel="stylesheet" href="responsive.css?v=13">
  <style>
      .overview-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 1.5rem;
      }
      .overview-header {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          flex-wrap: wrap;
          gap: 1.5rem;
          margin-bottom: 2rem;
          padding-bottom: 1.5rem;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .overview-branding {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
      }
      .overview-title-row {
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
      }
      .overview-symbol {
          font-size: 2.2rem;
          font-weight: 800;
          color: #fff;
          margin: 0;
          line-height: 1;
      }
      .overview-name {
          font-size: 1rem;
          color: var(--text-secondary);
      }
      .overview-price-block {
          display: flex;
          flex-direction: column;
          gap: 4px;
      }
      .overview-price-row {
          display: flex;
          align-items: baseline;
          gap: 10px;
      }
      .overview-price {
          font-family: 'Roboto Mono', monospace;
          font-size: 2.2rem;
          font-weight: 700;
          color: #fff;
      }
      .overview-change {
          font-family: 'Roboto Mono', monospace;
          font-size: 1.2rem;
          font-weight: 600;
      }
      .overview-meta-row {
          display: flex;
          gap: 12px;
          color: var(--text-secondary);
          font-size: 0.85rem;
          flex-wrap: wrap;
          align-items: center;
      }
      .overview-actions {
          display: flex;
          gap: 10px;
          align-items: center;
          flex-wrap: wrap;
      }
      .btn-primary {
          background: #4A90E2;
          color: #fff;
          border: none;
          padding: 10px 20px;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          transition: background 0.15s, transform 0.1s;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: 0.9rem;
      }
      .btn-primary:hover {
          background: #357ABD;
          transform: translateY(-1px);
      }
      .btn-outline {
          background: transparent;
          color: #d1d4dc;
          border: 1px solid #333;
          padding: 10px 18px;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.15s;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          font-size: 0.9rem;
      }
      .btn-outline:hover {
          border-color: #4A90E2;
          color: #fff;
          background: rgba(255,255,255,0.04);
      }
      .btn-buy {
          background: #089981;
          color: #0A0A0B;
          border: none;
          padding: 10px 18px;
          border-radius: 6px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.15s;
          font-size: 0.9rem;
      }
      .btn-buy:hover {
          opacity: 0.9;
          transform: translateY(-1px);
      }
      .btn-sell {
          background: #f23645;
          color: #fff;
          border: none;
          padding: 10px 18px;
          border-radius: 6px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.15s;
          font-size: 0.9rem;
      }
      .btn-sell:hover {
          opacity: 0.9;
          transform: translateY(-1px);
      }
      .overview-grid {
          display: grid;
          grid-template-columns: 1.8fr 1.2fr;
          gap: 1.5rem;
          margin-bottom: 2rem;
          align-items: start;
      }
      .overview-card {
          background: #111;
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 1.5rem;
      }
      .overview-card h3 {
          font-size: 1.1rem;
          font-weight: 600;
          color: #fff;
          margin-top: 0;
          margin-bottom: 1.25rem;
          display: flex;
          align-items: center;
          gap: 8px;
      }
      .stats-grid-inner {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 1.25rem;
          margin-bottom: 1.5rem;
      }
      .stat-item-inner {
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.04);
          border-radius: 8px;
          padding: 0.85rem 1rem;
      }
      .stat-item-inner .lbl {
          font-size: 0.75rem;
          color: var(--text-secondary);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin-bottom: 4px;
      }
      .stat-item-inner .val {
          font-family: 'Roboto Mono', monospace;
          font-size: 1.15rem;
          font-weight: 600;
          color: #fff;
      }
      .stat-range-container {
          padding-top: 1rem;
          border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .stat-range-label {
          font-size: 0.8rem;
          color: var(--text-secondary);
          margin-bottom: 6px;
          display: flex;
          justify-content: space-between;
      }
      .stat-range-bar {
          display: flex;
          align-items: center;
          gap: 10px;
      }
      .stat-range-track {
          position: relative;
          flex: 1;
          height: 6px;
          border-radius: 3px;
          background: linear-gradient(90deg, var(--danger), #52525b, var(--success));
      }
      .stat-range-marker {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #fff;
          border: 2px solid #111;
          transform: translate(-50%, -50%);
          box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
          transition: left 0.3s ease;
      }
      .news-sentiment-gauge-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 1rem 0;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
          margin-bottom: 1rem;
      }
      .news-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
          max-height: 420px;
          overflow-y: auto;
      }
      .news-item {
          padding: 10px;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.04);
          border-radius: 8px;
          font-size: 0.85rem;
          transition: background 0.15s;
          text-decoration: none;
          display: block;
      }
      .news-item:hover {
          background: rgba(255, 255, 255, 0.04);
      }
      .news-item-title {
          font-weight: 500;
          color: #fff;
          margin-bottom: 4px;
          line-height: 1.3;
      }
      .news-item-meta {
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 0.75rem;
          color: var(--text-secondary);
      }
      .sentiment-badge {
          font-size: 0.65rem;
          font-weight: 700;
          padding: 2px 6px;
          border-radius: 4px;
          text-transform: uppercase;
      }
      .sent-pos { background: rgba(8, 153, 129, 0.15); color: #089981; }
      .sent-neg { background: rgba(242, 54, 69, 0.15); color: #f23645; }
      .sent-neu { background: rgba(255, 255, 255, 0.08); color: #b2b5be; }
      
      .wl-toast {
          position: fixed;
          bottom: 2rem;
          right: 2rem;
          background: #1e1e24;
          border: 1px solid rgba(255,255,255,0.1);
          color: #fff;
          padding: 12px 24px;
          border-radius: 8px;
          box-shadow: 0 8px 24px rgba(0,0,0,0.5);
          z-index: 10000;
          transform: translateY(100px);
          opacity: 0;
          transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .wl-toast.show {
          transform: translateY(0);
          opacity: 1;
      }
      .wl-toast.warn { border-color: #ff9800; }
      .wl-toast.success { border-color: #089981; }
      
      @media (max-width: 900px) {
          .overview-grid { grid-template-columns: 1fr; }
          .stats-grid-inner { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 768px) {
          .overview-container {
              padding: 0.75rem 1rem !important;
          }
          .overview-header {
              flex-direction: column !important;
              align-items: flex-start !important;
              gap: 0.75rem !important;
              margin-bottom: 1.25rem !important;
              padding-bottom: 1rem !important;
          }
          .overview-symbol {
              font-size: 1.5rem !important;
          }
          .overview-name {
              font-size: 0.85rem !important;
          }
          .overview-price-block {
              gap: 2px !important;
              width: 100% !important;
          }
          .overview-price-row {
              justify-content: flex-start !important;
              gap: 8px !important;
          }
          .overview-price {
              font-size: 1.45rem !important;
          }
          .overview-change {
              font-size: 0.88rem !important;
          }
          .overview-actions {
              width: 100% !important;
              justify-content: flex-start !important;
              gap: 8px !important;
              margin-bottom: 1.25rem !important;
          }
          .btn-primary, .btn-outline, .btn-buy, .btn-sell {
              padding: 6px 12px !important;
              font-size: 0.78rem !important;
              height: 32px !important;
              border-radius: 6px !important;
              gap: 6px !important;
          }
          .btn-primary svg, .btn-outline svg {
              width: 14px !important;
              height: 14px !important;
          }
          .btn-primary {
              background: #1e40af !important;
              border: 1px solid rgba(59, 130, 246, 0.4) !important;
              color: #ffffff !important;
          }
          .btn-outline {
              background: rgba(255, 255, 255, 0.04) !important;
              border: 1px solid rgba(255, 255, 255, 0.15) !important;
              color: #d1d4dc !important;
          }
          .btn-buy {
              background: rgba(8, 153, 129, 0.16) !important;
              color: #26a69a !important;
              border: 1px solid rgba(8, 153, 129, 0.45) !important;
              font-weight: 600 !important;
          }
          .btn-sell {
              background: rgba(242, 54, 69, 0.16) !important;
              color: #ff6b7a !important;
              border: 1px solid rgba(242, 54, 69, 0.45) !important;
              font-weight: 600 !important;
          }
          .overview-grid {
              gap: 12px !important;
              margin-bottom: 1.25rem !important;
          }
          .overview-card {
              padding: 12px 14px !important;
              border-radius: 10px !important;
          }
          .overview-card h3 {
              font-size: 0.95rem !important;
              margin-bottom: 10px !important;
          }
          .overview-card h3 svg {
              width: 16px !important;
              height: 16px !important;
          }
          .stats-grid-inner {
              grid-template-columns: repeat(2, 1fr) !important;
              gap: 8px !important;
              margin-bottom: 12px !important;
          }
          .stat-item-inner {
              padding: 6px 10px !important;
              border-radius: 6px !important;
          }
          .stat-item-inner .lbl {
              font-size: 0.68rem !important;
              margin-bottom: 2px !important;
          }
          .stat-item-inner .val {
              font-size: 0.92rem !important;
          }
          .stat-range-container {
              padding-top: 8px !important;
          }
          .stat-range-label {
              font-size: 0.72rem !important;
              margin-bottom: 4px !important;
          }
          .stat-range-bar span {
              font-size: 0.75rem !important;
          }
          .news-item {
              padding: 8px 10px !important;
              border-radius: 6px !important;
          }
          .news-item-title {
              font-size: 0.8rem !important;
              margin-bottom: 3px !important;
          }
          .news-item-meta {
              font-size: 0.68rem !important;
          }
          .sentiment-badge {
              font-size: 0.6rem !important;
              padding: 1px 5px !important;
          }
          #downloadPdfBtn {
              font-size: 11px !important;
              padding: 3px 8px !important;
              height: 24px !important;
          }
      }
      @media (max-width: 480px) {
          .overview-actions {
              display: grid !important;
              grid-template-columns: 1fr 1fr !important;
              gap: 6px !important;
          }
          .btn-primary, .btn-outline, .btn-buy, .btn-sell {
              justify-content: center !important;
              width: 100% !important;
              padding: 6px 8px !important;
              font-size: 0.75rem !important;
          }
      }
  </style>
</head>
<body style="background-color: #0A0A0B;">
  <div id="nav-root"></div>
  
  <div class="overview-container">
    <div class="overview-header">
      <div class="overview-branding">
        <div class="overview-title-row">
          <div id="overviewTickerLogo" style="display:inline-flex;align-items:center;"></div>
          <h1 class="overview-symbol" id="tickerSymbol">--</h1>
          <span class="stock-badge" id="tickerBadge">NSE</span>
          <span class="sector-tag" id="sectorTag" style="font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,0.08);color:#b2b5be;border:1px solid rgba(255,255,255,0.1);">Loading...</span>
        </div>
        <div class="overview-name" id="tickerCompanyName">--</div>
        <div class="overview-meta-row">
          <span id="marketStatusPill" class="status-dot closed" style="margin-right:4px;"></span>
          <span id="marketStatusText">Market Closed</span>
        </div>
      </div>
      
      <div class="overview-price-block">
        <div class="overview-price-row">
          <span class="overview-price" id="headerPrice">--</span>
          <span class="overview-change" id="headerChange">--</span>
        </div>
        <div style="font-size:0.75rem; color:var(--text-secondary); text-align:right;" id="liveTime">--</div>
      </div>
    </div>
    
    <div class="overview-actions" style="margin-bottom: 2rem;">
      <button class="btn-primary" id="btnChartLink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM9 17v-4m3 4V9m3 8v-6"/></svg>
        Open Interactive Chart
      </button>
      <button class="btn-outline" id="btnWatchlistToggle" onclick="toggleWatchlist()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Add to Watchlist
      </button>
      <button class="btn-buy" id="btnBuyAction">Buy</button>
      <button class="btn-sell" id="btnSellAction">Sell</button>
    </div>
    
    <div class="overview-grid">
      <div class="overview-card">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Key Statistics
        </h3>
        
        <div class="stats-grid-inner">
          <div class="stat-item-inner"><div class="lbl">Open</div><div class="val" id="statOpen">--</div></div>
          <div class="stat-item-inner"><div class="lbl">High</div><div class="val" id="statHigh">--</div></div>
          <div class="stat-item-inner"><div class="lbl">Low</div><div class="val" id="statLow">--</div></div>
          <div class="stat-item-inner"><div class="lbl">Prev Close</div><div class="val" id="statPrevClose">--</div></div>
          <div class="stat-item-inner"><div class="lbl">Volume</div><div class="val" id="statVolume">--</div></div>
          <div class="stat-item-inner"><div class="lbl">Mkt Cap</div><div class="val" id="statMarketCap">--</div></div>
        </div>
        
        <div class="stat-range-container">
          <div class="stat-range-label">
            <span>Day Low</span>
            <span>Day High</span>
          </div>
          <div class="stat-range-bar">
            <span style="font-family:'Roboto Mono',monospace;font-size:0.85rem;color:var(--text-secondary);" id="statDayLow">--</span>
            <div class="stat-range-track">
              <div class="stat-range-marker" id="statDayRangeMarker"></div>
            </div>
            <span style="font-family:'Roboto Mono',monospace;font-size:0.85rem;color:var(--text-secondary);" id="statDayHigh">--</span>
          </div>
        </div>
      </div>
      
      <div class="overview-card">
        <h3 style="display:flex; justify-content:space-between; align-items:center; width:100%;">
          <span style="display:inline-flex; align-items:center; gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            News & Sentiment
          </span>
          <button id="downloadPdfBtn" onclick="downloadNewsPDF()" style="background:#4A90E2; border:none; color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:600; font-size:12px; display:inline-flex; align-items:center; gap:4px; transition:opacity 0.15s;">
            &#128196; Download PDF
          </button>
        </h3>
        
        <div class="news-sentiment-gauge-wrapper">
          <svg width="130" height="65" viewBox="0 0 100 55" style="display:block; margin:0 auto;">
            <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round" />
            <path d="M 10 50 A 40 40 0 0 1 90 50" id="sentimentGaugeFill" fill="none" stroke="url(#sentGradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="125.6" style="transition: stroke-dashoffset 0.8s ease;" />
            <defs>
              <linearGradient id="sentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f23645" />
                <stop offset="50%" stop-color="#ff9800" />
                <stop offset="100%" stop-color="#089981" />
              </linearGradient>
            </defs>
            <g id="sentimentNeedle" style="transform-origin: 50px 50px; transition: transform 0.8s ease; transform: rotate(-90deg);">
              <polygon points="50,50 48,15 52,15" fill="#fff" />
              <circle cx="50" cy="50" r="3" fill="#fff" />
            </g>
            <text x="50" y="46" id="sentimentValText" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">--</text>
          </svg>
          <div id="sentimentLabel" style="font-size:0.75rem; font-weight:700; text-transform:uppercase; margin-top:4px; color:#52525b;">Neutral</div>
          <div id="sentimentSource" style="font-size:0.65rem; color:var(--text-secondary); margin-top:2px;">No articles analyzed</div>
        </div>
        
        <div class="news-list" id="newsListContainer">
          <div style="color:var(--text-secondary);padding:1rem 0;text-align:center;font-size:0.85rem;">Loading ticker news...</div>
        </div>
      </div>
    </div>
  </div>
  
  <div id="wlToast" class="wl-toast"></div>
  
  <script>
    (function () {
      var queryParams = new URLSearchParams(window.location.search);
      var ticker = queryParams.get('ticker') || 'RELIANCE';
      ticker = ticker.trim().toUpperCase().replace('.NS', '').replace('.BO', '');
      
      document.getElementById('tickerSymbol').textContent = ticker;
      var logoSlot = document.getElementById('overviewTickerLogo');
      if (logoSlot) {
          var clean = ticker.toUpperCase();
          var initials = clean.slice(0, 2);
          var colors = ['#1e88e5','#43a047','#e53935','#8e24aa','#fb8c00','#00acc1','#3949ab','#d81b60','#00897b','#5e35b1'];
          var hash = 0;
          for (var i = 0; i < clean.length; i++) hash = (hash * 31 + clean.charCodeAt(i)) & 0xffffffff;
          var bg = colors[Math.abs(hash) % colors.length];
          logoSlot.innerHTML = '<div style="width:38px;height:38px;border-radius:50%;background:#ffffff;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(255,255,255,0.12);padding:2px;box-sizing:border-box;margin-right:6px;">' +
              '<img src="logos/' + encodeURIComponent(clean) + '.svg" alt="' + clean + '" style="width:100%;height:100%;object-fit:contain;border-radius:50%;display:block;" onerror="this.onerror=null;this.parentElement.style.background=\'' + bg + '\';this.parentElement.style.color=\'#ffffff\';this.parentElement.innerHTML=\'<span style=\\\'font-size:14px;font-weight:700;\\\'>' + initials + '</span>\';">' +
              '</div>';
      }
      document.getElementById('btnChartLink').onclick = function() {
          window.location.href = 'stock.html?ticker=' + encodeURIComponent(ticker);
      };
      var btnBuy = document.getElementById('btnBuyAction');
      if (btnBuy) {
          btnBuy.onclick = function() {
              window.location.href = 'stock.html?ticker=' + encodeURIComponent(ticker) + '&action=buy';
          };
      }
      var btnSell = document.getElementById('btnSellAction');
      if (btnSell) {
          btnSell.onclick = function() {
              window.location.href = 'stock.html?ticker=' + encodeURIComponent(ticker) + '&action=sell';
          };
      }
      
      var knownSectors = {
          'RELIANCE': 'Energy', 'TCS': 'IT', 'HDFCBANK': 'Banking', 'INFY': 'IT', 'ICICIBANK': 'Banking',
          'BHARTIARTL': 'Telecom', 'SBIN': 'Banking', 'HINDUNILVR': 'FMCG', 'ITC': 'FMCG', 'LT': 'Construction',
          'KOTAKBANK': 'Banking', 'AXISBANK': 'Banking', 'ASIANPAINT': 'Consumer Goods', 'MARUTI': 'Auto',
          'WIPRO': 'IT', 'TITAN': 'Consumer Goods', 'SUNPHARMA': 'Pharma', 'BAJFINANCE': 'Financial Services',

      function fmt(val) {
          if (val == null || isNaN(val) || val === 0) return '--';
          return '₹' + val.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      
      function fmtVol(val) {
          if (val == null || isNaN(val) || val === 0) return '--';
          if (val >= 10000000) return (val / 10000000).toFixed(2) + ' Cr';
          if (val >= 100000) return (val / 100000).toFixed(2) + ' L';
          return val.toLocaleString('en-IN');
      }

      function updateDayRange(low, high, current) {
          var labelLow = document.getElementById('statDayLow');
          var labelHigh = document.getElementById('statDayHigh');
          var marker = document.getElementById('statDayRangeMarker');
          
          if (labelLow) labelLow.textContent = low ? '₹' + low.toFixed(2) : '--';
          if (labelHigh) labelHigh.textContent = high ? '₹' + high.toFixed(2) : '--';
          
          if (marker && low && high && current) {
              var range = high - low;
              var pct = range > 0 ? ((current - low) / range) * 100 : 50;
              marker.style.left = Math.max(0, Math.min(100, pct)) + '%';
          }
      }

      function applyLiveStats(d) {
          if (!d) return;
          var cp = d.current_price || d.current || 0;
          var pc = d.prev_close || 0;
          var open = d.open || 0;
          var high = d.high || cp || 0;
          var low = d.low || cp || 0;
          var vol = d.volume || 0;
          
          var diff = cp - pc;
          var pct = pc > 0 ? (diff / pc) * 100 : 0;
          var sign = diff >= 0 ? '+' : '';
          var color = diff >= 0 ? '#089981' : '#f23645';
          
          document.getElementById('headerPrice').textContent = fmt(cp);
          document.getElementById('headerPrice').style.color = color;
          
          var chgEl = document.getElementById('headerChange');
          if (chgEl) {
              chgEl.textContent = sign + diff.toFixed(2) + ' (' + sign + pct.toFixed(2) + '%)';
              chgEl.style.color = color;
          }
          
          document.getElementById('statOpen').textContent = fmt(open);
          document.getElementById('statHigh').textContent = fmt(high);
          document.getElementById('statLow').textContent = fmt(low);
          document.getElementById('statPrevClose').textContent = fmt(pc);
          document.getElementById('statVolume').textContent = fmtVol(vol);
          
          var weightMap = {
              'RELIANCE': '₹18.15 Lakh Cr', 'TCS': '₹12.45 Lakh Cr', 'HDFCBANK': '₹11.20 Lakh Cr',

      // ---- News & AI Sentiment ----
      function getSentimentScore(a) {
          if (!a || !a.sentiment) return 0.03;
          var s = a.sentiment;
          var score = null;
          if (typeof s === 'object' && s.sentiment_score != null) {
              score = Number(s.sentiment_score);
          } else if (typeof a.sentiment_score === 'number') {
              score = a.sentiment_score;
          }
          if (score == null || isNaN(score) || score === 0) return 0.03;
          return score;
      }

      function getSentimentLabel(a) {
          // Never return neutral — resolve from label then fall back to score sign
          var score = getSentimentScore(a);
          if (!a || !a.sentiment) return score < 0 ? 'negative' : 'positive';
          var s = a.sentiment;
          var label = '';
          if (typeof s === 'string') {
              label = s.toLowerCase();
          } else if (typeof s === 'object') {
              label = (s.label || s.sentiment || '').toLowerCase();
          }
          if (label === 'positive' || label === 'bullish') return 'positive';
          if (label === 'negative' || label === 'bearish') return 'negative';
          // label is neutral or empty — use score sign
          return score < 0 ? 'negative' : 'positive';
      }

      function _cleanOverviewNewsTitle(t, excerpt, tk) {
          var raw = (t || '').trim();
          var clean = raw.replace(/\s*[-–|]\s*scanx\.trade\s*$/i, '').trim();
          if (clean.indexOf(' - ') !== -1 || clean.indexOf(' | ') !== -1 || clean.indexOf(' – ') !== -1) {
              var cand = clean.replace(/\s*[-–|]\s*[^–\-|]+$/, '').trim();
              var candWords = cand.split(/\s+/).filter(Boolean);
              if (cand && candWords.length >= 3 && cand.length >= 15) {
                  clean = cand;
              }
          }
          var words = clean.split(/\s+/).filter(Boolean);
          if (words.length <= 1 || clean.length < 10) {
              if (excerpt) {
                  var cleanEx = excerpt.replace(/<[^>]*>/g, '').replace(/&[a-z0-9#]+;/gi, ' ').trim();
                  var exWords = cleanEx.split(/\s+/).filter(Boolean);
                  if (exWords.length >= 4) {
                      var firstSent = cleanEx.split(/[.!?]/)[0].trim();
                      if (firstSent.length >= 15) {
                          return firstSent.length > 95 ? firstSent.slice(0, 95) + '...' : firstSent;
                      }
                      return exWords.slice(0, 12).join(' ') + '...';
                  }
              }
              if (tk && words.length === 1) {
                  return tk + ': Latest Market News & Updates';
              }
          }
          return clean || raw || 'Market News & Updates';
      }

      var showingAllNews = false;
      function renderNews(articles) {
          var container = document.getElementById('newsListContainer');
          if (!container) return;
          
          var validArticles = (articles || []).filter(function(a) {
              var t = _cleanOverviewNewsTitle(a.title, a.excerpt || a.summary, ticker);
              return t && t.split(/\s+/).filter(Boolean).length >= 2;
          });
          
          if (!validArticles || validArticles.length === 0) {
              container.innerHTML = '<div style="color:var(--text-secondary);padding:1rem 0;text-align:center;font-size:0.85rem;">No recent news articles found for this ticker</div>';
              updateSentimentUI(50, 0);
              return;
          }
          
          var positiveCount = 0;
          var negativeCount = 0;
          var neutralCount = 0;
          
          var itemsToShow = showingAllNews ? validArticles : validArticles.slice(0, 3);
          
          var html = itemsToShow.map(function(a) {
              var sent = getSentimentLabel(a);
              var badgeClass = 'sent-neu';
              if (sent === 'positive') { badgeClass = 'sent-pos'; }
              else if (sent === 'negative') { badgeClass = 'sent-neg'; }

              var score = getSentimentScore(a);
              var labelText = sent === 'positive' ? 'Bullish' : sent === 'negative' ? 'Bearish' : 'Neutral';
              var arrow = sent === 'positive' ? '▲' : sent === 'negative' ? '▼' : '●';
              var scoreText = '';
              if (score != null) {
                  var sign = score >= 0 ? '+' : '';
                  scoreText = ' ' + sign + score.toFixed(2);
              }
              var badgeContent = arrow + ' ' + labelText + scoreText;

              var dateStr = a.published_date || a.published_at || a.date || 'Today';
              if (dateStr.indexOf('T') !== -1) {
                  try { dateStr = new Date(dateStr).toLocaleDateString('en-IN', {dateStyle:'medium'}); } catch(e){}
              }
              var src = a.source || 'LEVERAGE AI';
              var link = a.url && a.url !== '#' ? a.url : '#';
              var displayTitle = _cleanOverviewNewsTitle(a.title, a.excerpt || a.summary, ticker);

              return '<a href="' + link + '" target="_blank" class="news-item">' +
                  '<div class="news-item-title">' + displayTitle + '</div>' +
                  '<div class="news-item-meta">' +
                  '<span>' + src + ' &bull; ' + dateStr + '</span>' +
                  '<span class="sentiment-badge ' + badgeClass + '" style="letter-spacing:0.01em;">' + badgeContent + '</span>' +
                  '</div>' +
                  '</a>';
          }).join('');
          
          // Count sentiments from ALL loaded articles for accurate sentiment index gauge
          articles.forEach(function(a) {
              var sent = getSentimentLabel(a);
              if (sent === 'positive') positiveCount++;
              else if (sent === 'negative') negativeCount++;
              else neutralCount++;
          });
          
          var total = positiveCount + negativeCount;
          var sentimentVal = 50;
          if (total > 0) {
              sentimentVal = Math.round((positiveCount / total) * 100);
          }
          
          if (articles.length > 3) {
              var toggleText = showingAllNews ? 'Show Less Articles' : 'Show All Articles (' + articles.length + ')';
              html += '<button id="btnToggleNewsLimit" onclick="toggleNewsLimit()" style="width:100%;margin-top:12px;background:transparent;border:1px dashed rgba(255,255,255,0.12);color:#4A90E2;padding:8px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:all 0.15s;font-family:inherit;">' + toggleText + '</button>';
          }
          
          container.innerHTML = html;
          updateSentimentUI(sentimentVal, articles.length);
      }

      function updateSentimentUI(score, count) {
          var fill = document.getElementById('sentimentGaugeFill');
          var needle = document.getElementById('sentimentNeedle');
          var valTxt = document.getElementById('sentimentValText');
          var lblTxt = document.getElementById('sentimentLabel');
          var srcTxt = document.getElementById('sentimentSource');
          
          if (fill) {

          }
          if (needle) {

              else if (score > 60) { mood = 'Bullish'; color = '#089981'; }
              lblTxt.textContent = mood;
              lblTxt.style.color = color;
          }
          
          if (srcTxt) {
              srcTxt.textContent = count > 0 ? 'Based on ' + count + ' recent articles' : 'No articles analyzed';
          }

      function _parseOverviewDate(dateStr) {
          if (!dateStr) return 0;
          var t = Date.parse(dateStr);
          if (!isNaN(t)) return t;
          try {
              var d = new Date(dateStr);
              return isNaN(d.getTime()) ? 0 : d.getTime();
          } catch(e) { return 0; }
      }

      function _sortOverviewNews(arts) {
          return (arts || []).slice().sort(function(a, b) {
              var da = _parseOverviewDate(a.published_date || a.published_at || a.date);
              var db = _parseOverviewDate(b.published_date || b.published_at || b.date);
              return db - da;
          });
      }

          var container = document.getElementById('newsListContainer');
          if (container) {

          }

      function _overviewNewsDelay(ms) {
          return new Promise(function(resolve) { setTimeout(resolve, ms); });
      }

      async function fetchTickerNews() {
          // Fetch from live news search (uses scanx.trade + google news rss with
          // sentiments). The Promise form of PageCache.fetch (rather than only a
          // callback) resolves with the data OR null on a provider failure, so a
          // failure can be handled explicitly instead of leaving the section
          // stuck on "Syncing live news...".
          try {
              var data = await PageCache.fetch('/api/news/search/' + encodeURIComponent(ticker), null, 600000);
              if (Array.isArray(data) && data.length > 0) {
                  window.allFetchedArticles = _sortOverviewNews(data);
                  renderNews(window.allFetchedArticles);
                  return;
              }
              // Cold cache: the first /api/news/search response can be [] while
              // the backend refreshes its provider cache in the background. Show
              // a syncing state and retry EXACTLY ONCE before falling back to the
              // proxy endpoint, so the section does not flash "no recent news".
              _renderOverviewNewsSyncing();
              await _overviewNewsDelay(2500);
              var data2 = await PageCache.fetch('/api/news/search/' + encodeURIComponent(ticker), null, 600000);
              if (Array.isArray(data2) && data2.length > 0) {
                  window.allFetchedArticles = _sortOverviewNews(data2);
                  renderNews(window.allFetchedArticles);
                  return;
              }
              // Last-resort proxy (synthetic live/DB quote).
              var d2 = await PageCache.fetch('/api/news/ticker/' + ticker, null, 600000);
              if (d2 && d2.articles) {
                  window.allFetchedArticles = _sortOverviewNews(d2.articles);
                  renderNews(window.allFetchedArticles);
              } else {
                  window.allFetchedArticles = [];
                  renderNews([]);
              }
          } catch (e) {
              // Provider error / unexpected failure: degrade to the empty state
              // rather than leaving a stuck "syncing" placeholder.
              window.allFetchedArticles = [];
              renderNews([]);
          }
      }

                  '<div style="background:#f8f8f8;border-left:5px solid ' + accentColor + ';border-radius:6px;padding:1rem 1.25rem;margin-bottom:1.75rem;">' +
                    '<div style="font-size:0.68rem;font-weight:700;letter-spacing:1px;color:#888;text-transform:uppercase;margin-bottom:4px;">Overall Sentiment Rating</div>' +
                    '<div style="font-size:1.5rem;font-weight:800;color:' + accentColor + ';">' + sentimentLabel + ' (' + sentimentScore + ')</div>' +
                  '</div>';

              // Use ALL fetched articles (not just the 3 visible DOM nodes)
              var pdfArticles = (window.allFetchedArticles && window.allFetchedArticles.length)
                  ? window.allFetchedArticles : [];

              var itemsHtml = pdfArticles.map(function(a) {
                  var sent  = getSentimentLabel(a);
                  var score = getSentimentScore(a);
                  var isPos = sent === 'positive';
                  var labelText = isPos ? 'Bullish' : 'Bearish';
                  var arrow     = isPos ? '▲' : '▼';
                  var sign      = score >= 0 ? '+' : '';
                  var badgeText = arrow + ' ' + labelText + ' ' + sign + score.toFixed(2);
                  var badgeBg   = isPos ? '#e6f7f4' : '#fdecea';
                  var badgeFg   = isPos ? '#089981'  : '#f23645';

                  var dateStr = a.published_date || a.published_at || a.date || '';
                  if (dateStr && dateStr.indexOf('T') !== -1) {
                      try { dateStr = new Date(dateStr).toLocaleDateString('en-IN', {dateStyle:'medium'}); } catch(e) {}
                  }
                  var src = (a.source || 'ScanX').replace(/scanx\.trade/i, 'ScanX');
                  var title = (a.title || '').replace(/\s*[-–|]\s*scanx\.trade\s*$/i,'').replace(/\s*\|\s*[^|]+$/, '').trim();

                  return '<div style="margin-bottom:0.75rem;padding:0.8rem 1rem;background:#fff;border:1px solid #e8e8e8;border-radius:6px;">' +
                      '<div style="font-weight:600;color:#111;font-size:0.88rem;margin-bottom:5px;line-height:1.45;">' + title + '</div>' +
                      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.73rem;color:#888;">' +
                        '<span>' + src + (dateStr ? ' · ' + dateStr : '') + '</span>' +
                        '<span style="padding:3px 9px;border-radius:4px;font-size:0.67rem;font-weight:700;background:' + badgeBg + ';color:' + badgeFg + ';">' + badgeText + '</span>' +
                      '</div>' +
                      '</div>';
              }).join('') || '<div style="color:#888;font-size:0.85rem;padding:1rem 0;">No articles found.</div>';

              var footerHtml =
                  '<div style="margin-top:2rem;padding-top:0.75rem;border-top:1px solid #e0e0e0;font-size:0.68rem;color:#bbb;text-align:center;">' +
                    'Generated by LEVERAGE · For informational purposes only · Not financial advice' +
                  '</div>';

              exportEl.innerHTML = headerHtml + sentimentHtml +
                  '<h3 style="font-size:0.85rem;font-weight:700;letter-spacing:0.5px;color:#444;text-transform:uppercase;margin-bottom:0.85rem;">Recent Articles</h3>' +
                  itemsHtml + footerHtml;

              document.body.appendChild(exportEl);
              await html2pdf().set(opt).from(exportEl).save();
              document.body.removeChild(exportEl);
              if (btn) { btn.innerHTML = '&#128196; Download PDF'; btn.style.opacity = '1'; }
          } catch (err) {
              console.error('PDF generation failed:', err);
              alert('Failed to generate PDF.');
              if (btn) { btn.innerHTML = '&#128196; Download PDF'; btn.style.opacity = '1'; }
          }
      };

      // ---- Real-time WebSocket Updates ----
      var ws = null;
      var reconnectTimer = null;
      var reconnectAttempt = 0;

      function connectWS() {
          var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          var url = proto + '//' + window.location.host + '/ws/dashboard';
          ws = new WebSocket(url);

          ws.onopen = function() {
              reconnectAttempt = 0;
              if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
              ws.send(JSON.stringify({ type: 'subscribe', topics: [ticker, 'NIFTY', 'BANKNIFTY', 'SENSEX'] }));
          };

          ws.onmessage = function(evt) {
              try {
                  var msg = JSON.parse(evt.data);
                  if (msg.type === 'price_update' && msg.data && msg.data[ticker]) {
                      var tick = msg.data[ticker];
                      if (tick.current) {
                          var updatedData = {
                              current_price: tick.current,
                              prev_close: tick.prev_close || 0,
                              open: tick.open || 0,
                              high: tick.high || tick.current,
                              low: tick.low || tick.current,
                              volume: tick.volume || 0
                          };
                          applyLiveStats(updatedData);
                      }
                  }
              } catch(e) {}
          };

          ws.onclose = function() {
              ws = null;
              scheduleReconnect();
          };

          ws.onerror = function() {
              ws = null;
              scheduleReconnect();
          };
      }

      function scheduleReconnect() {
          if (reconnectTimer) return;
          var delay = Math.min(1000 * Math.pow(2, reconnectAttempt), 30000) + Math.random() * 1000;
          reconnectAttempt = Math.min(reconnectAttempt + 1, 10);
          reconnectTimer = setTimeout(function() {
              reconnectTimer = null;
              connectWS();
          }, delay);
      }

      // ---- Startup ----
      checkWatchlistState();
      fetchTickerLive();
      fetchTickerNews();
      connectWS();
      
      var _intLive = setInterval(fetchTickerLive, 15000);
      document.addEventListener('visibilitychange', function() {
          if (document.hidden) { clearInterval(_intLive); _intLive = null; }
          else if (!_intLive) { _intLive = setInterval(fetchTickerLive, 15000); fetchTickerLive(); }
      });
      
    })();
  </script>
  <script src="stocks.js"></script>
  <script src="nav.js?v=9"></script>
</body>
