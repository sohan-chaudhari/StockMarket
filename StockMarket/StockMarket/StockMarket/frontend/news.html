<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - LEVERAGE</title>
    <meta name="description" content="Live Indian stock market news with AI-powered sentiment analysis. Stay updated on Nifty, Sensex, and top stocks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css?v=2">
    <link rel="stylesheet" href="index.css?v=82">
    <link rel="stylesheet" href="nav.css?v=12">
    <style>
        .news-layout{display:grid;grid-template-columns:220px 1fr;gap:1.5rem;}
        .sidebar{display:flex;flex-direction:column;gap:0.25rem;}
        .sidebar-btn{padding:0.6rem 1rem;background:transparent;border:none;color:var(--text-secondary);text-align:left;font-size:0.85rem;font-weight:500;border-radius:8px;cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;}
        .sidebar-btn:hover{background:rgba(255,255,255,0.05);color:#fff;}
        .sidebar-btn.active{background:rgba(74,144,226,0.15);color:#4A90E2;}
        .featured-headline{background:linear-gradient(135deg,#1a1a2e,#111);border:1px solid rgba(74,144,226,0.2);border-radius:12px;padding:2rem;margin-bottom:1.5rem;cursor:pointer;transition:all 0.2s;position:relative;}
        .featured-headline:hover{border-color:rgba(74,144,226,0.4);}
        .featured-headline h2{font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;}
        .featured-headline p{color:var(--text-secondary);font-size:0.9rem;}
        .featured-badge{display:inline-block;padding:3px 10px;background:rgba(8, 153, 129,0.15);color:#089981;border-radius:20px;font-size:0.7rem;font-weight:600;margin-bottom:0.75rem;}
        .source-badge{display:inline-block;padding:2px 8px;background:rgba(74,144,226,0.1);color:#4A90E2;border-radius:4px;font-size:0.7rem;font-weight:600;margin-left:6px;}
        .news-list{display:flex;flex-direction:column;gap:0.75rem;}
        .news-card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:1.25rem;cursor:pointer;transition:all 0.2s;position:relative;}
        .news-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-1px);}
        .news-card .meta{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;font-size:0.75rem;color:var(--text-secondary);}
        .news-card .title{font-size:1rem;font-weight:600;color:#fff;margin-bottom:0.35rem;padding-right:1.5rem;}
        .news-card .excerpt{font-size:0.85rem;color:var(--text-secondary);line-height:1.4;}
        .sentiment-tag{padding:2px 8px;border-radius:4px;font-size:0.7rem;font-weight:600;}
        .sentiment-bullish{background:rgba(8, 153, 129,0.15);color:#089981;}
        .sentiment-bearish{background:rgba(242, 54, 69,0.15);color:#f23645;}
        .sentiment-neutral{background:rgba(255,255,255,0.1);color:var(--text-secondary);}
        .page-title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;}
        .page-subtitle{color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem;}
        .search-news{display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;}
        .search-news input{flex:1;min-width:200px;padding:0.65rem 1rem;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:0.9rem;outline:none;}
        .search-news input:focus{border-color:var(--accent-blue);}
        .bookmark-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:1rem;padding:4px;border-radius:4px;transition:all 0.15s;}
        .bookmark-btn:hover{color:#ffd700;background:rgba(255,215,0,0.1);}
        .bookmark-btn.saved{color:#ffd700;}
        .news-loading{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:2rem;color:var(--text-secondary);}
        .spinner{width:18px;height:18px;border:2px solid rgba(74,144,226,0.3);border-top-color:#4A90E2;border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        @media(max-width:768px){.news-layout{grid-template-columns:1fr;}}
    </style>
    <script src="page-cache.js"></script>
    <script src="ws.js"></script>
</head>
<body style="background-color: #0A0A0B;">
    <div id="nav-root"></div>
    <main class="page-content">
        <h1 class="page-title">News</h1>
        <p class="page-subtitle">Market news with AI-powered sentiment analysis &ndash; bookmark what matters</p>
        <div class="search-news">
            <input type="text" id="newsSearch" placeholder="Search by stock ticker or keyword..." oninput="window.newsApp.filterNews(this.value)">
            <input type="text" id="stockFilter" placeholder="Filter by ticker (e.g. RELIANCE)" style="max-width:200px;" oninput="window.newsApp.filterNews(document.getElementById('newsSearch').value)">
        </div>
        <div class="news-layout">
            <aside class="sidebar" id="newsCategories">
                <button class="sidebar-btn active" id="catBtn-latest" onclick="window.newsApp.switchCategory('latest',this)">&#128240; Latest</button>
                <button class="sidebar-btn" id="catBtn-bullish" onclick="window.newsApp.switchCategory('bullish',this)">&#128200; Bullish</button>
                <button class="sidebar-btn" id="catBtn-bearish" onclick="window.newsApp.switchCategory('bearish',this)">&#128201; Bearish</button>
                <button class="sidebar-btn" id="catBtn-earnings" onclick="window.newsApp.switchCategory('earnings',this)">&#128176; Earnings</button>
                <button class="sidebar-btn" id="catBtn-ipo" onclick="window.newsApp.switchCategory('ipo',this)">&#127970; IPO</button>
                <button class="sidebar-btn" id="catBtn-economy" onclick="window.newsApp.switchCategory('economy',this)">&#128202; Economy</button>
                <button class="sidebar-btn" id="catBtn-bookmarked" onclick="window.newsApp.showBookmarked(this)" style="margin-top:0.5rem;border-top:1px solid rgba(255,255,255,0.06);padding-top:0.75rem;">&#128278; Bookmarks <span id="bookmarkCount" style="font-size:0.75rem;color:var(--text-secondary);margin-left:4px;">(0)</span></button>
            </aside>
            <div>
                <div class="featured-headline" id="featuredHeadline">
                    <span class="featured-badge">&#128308; LIVE</span>
                    <h2 id="featuredTitle">Loading latest market news&hellip;</h2>
                    <p id="featuredExcerpt">Fetching live data from news sources&hellip;</p>
                </div>
                <div id="newsStatus" style="display:none;background:rgba(255,193,7,0.15);border:1px solid rgba(255,193,7,0.3);color:#FFC107;padding:0.5rem 1rem;border-radius:8px;margin-bottom:0.75rem;font-size:0.85rem;text-align:center;"></div>
                <div class="news-list" id="newsContainer">
                    <div class="news-loading"><div class="spinner"></div> Loading live news&hellip;</div>
                </div>
            </div>
        </div>
    </main>

    <script>
    // =====================================================================
    //  News Page App &ndash; all functions exposed on window.newsApp to avoid
    //  IIFE scope traps. openPageNewsDetail also exposed on window directly
    //  since it's used from dynamically generated HTML data-attributes.
    // =====================================================================
    (function () {
        'use strict';

        var allNews = [];
        var currentCategory = 'latest';
        var bookmarks = [];
        try { bookmarks = JSON.parse(localStorage.getItem('leverage_bookmarks') || '[]'); } catch(e) {}

        /* ---- Helpers ------------------------------------------------------------------------------------------------------ */

        function saveBookmarks() {
            try { localStorage.setItem('leverage_bookmarks', JSON.stringify(bookmarks)); } catch(e) {}
            updateBookmarkCount();
        }

        function updateBookmarkCount() {
            var el = document.getElementById('bookmarkCount');
            if (el) el.textContent = '(' + bookmarks.length + ')';
        }

        function _normaliseSentiment(raw) {
            if (!raw) return 'Neutral';
            var l = (typeof raw === 'string' ? raw : (raw.label || raw.sentiment || '')).toLowerCase();
            if (l === 'positive' || l === 'bullish') return 'Bullish';
            if (l === 'negative' || l === 'bearish') return 'Bearish';
            return 'Neutral';
        }

        function _timeAgo(dateStr) {
            if (!dateStr) return '';
            try {
                var d = new Date(dateStr);
                var sec = Math.floor((Date.now() - d) / 1000);
                if (sec < 60)   return 'just now';
                if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
                if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
                return Math.floor(sec / 86400) + 'd ago';
            } catch(e) { return ''; }
        }

        function _escHtml(s) {
            return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function _cleanTitle(t) {
            return (t || '').replace(/\s*-\s*scanx\.trade\s*$/i, '').replace(/\s*\|\s*scanx\.trade\s*$/i, '').trim();
        }

        /* ---- Render -------------------------------------------------------------------------------------------------------- */

        function renderList(items) {
            var container = document.getElementById('newsContainer');
            if (!items || items.length === 0) {
                container.innerHTML = '<div style="color:var(--text-secondary);padding:2rem;text-align:center;">No news found for this category</div>';
                return;
            }
            // Store globally so openPageNewsDetail can access by index
            window._newsPageArticles = items;
            var html = items.slice(0, 30).map(function (n, i) {
                var label = _normaliseSentiment(n.sentiment);
                var sentClass = label === 'Bullish' ? 'sentiment-bullish' : (label === 'Bearish' ? 'sentiment-bearish' : 'sentiment-neutral');
                var timeAgo = _timeAgo(n.published_at);
                var cleanTitle = _cleanTitle(n.title);
                var url = n.url || '';
                var isBookmarked = bookmarks.indexOf(url || i + '') >= 0;
                var source = n.source ? ('<span class="source-badge">' + _escHtml(n.source) + '</span>') : '';
                return '<div class="news-card" data-news-idx="' + i + '">' +
                    '<div class="meta">' +
                        '<span style="color:var(--accent-blue);font-weight:600;">' + _escHtml(n.ticker || 'MARKET') + '</span>' +
                        (timeAgo ? '<span>' + timeAgo + '</span>' : '') +
                        (label ? '<span class="sentiment-tag ' + sentClass + '">' + label + '</span>' : '') +
                        source +
                    '</div>' +
                    '<div class="title">' + _escHtml(cleanTitle) + '</div>' +
                    (n.excerpt ? '<div class="excerpt">' + _escHtml(n.excerpt) + '</div>' : '') +
                    '<button class="bookmark-btn' + (isBookmarked ? ' saved' : '') + '" data-bm-url="' + _escHtml(url || i + '') + '" title="Bookmark">&#128278;</button>' +
                    '</div>';
            }).join('');
            container.innerHTML = html;
        }

        function renderNews() {
            var filtered = allNews;
            var cat = currentCategory;
            if (cat === 'bullish') {
                filtered = allNews.filter(function (n) {
                    return _normaliseSentiment(n.sentiment) === 'Bullish';
                });
            } else if (cat === 'bearish') {
                filtered = allNews.filter(function (n) {
                    return _normaliseSentiment(n.sentiment) === 'Bearish';
                });
            } else if (cat === 'earnings') {
                filtered = allNews.filter(function (n) {
                    var t = (n.title || '').toLowerCase();
                    return t.includes('earning') || t.includes('profit') || t.includes('result') || t.includes('quarterly') || t.includes('q1') || t.includes('q2') || t.includes('q3') || t.includes('q4');
                });
            } else if (cat === 'ipo') {
                filtered = allNews.filter(function (n) {
                    var t = (n.title || '').toLowerCase();
                    return t.includes('ipo') || t.includes('listing') || t.includes('allotment') || t.includes('public offer');
                });
            } else if (cat === 'economy') {
                filtered = allNews.filter(function (n) {
                    var t = (n.title || '').toLowerCase();
                    return t.includes('rbi') || t.includes('gdp') || t.includes('inflation') || t.includes('repo') || t.includes('budget') || t.includes('economy') || t.includes('fiscal') || t.includes('sebi');
                });
            } else if (cat === 'bookmarked') {
                filtered = allNews.filter(function (n, i) { return bookmarks.indexOf(n.url || i + '') >= 0; });
            }
            renderList(filtered);
        }

        /* ---- Detail modal ---------------------------------------------------------------------------------------------- */

        function openPageNewsDetail(idx) {
            var items = window._newsPageArticles || [];
            var n = items[idx];
            if (!n) return;
            var label = _normaliseSentiment(n.sentiment);
            var sentColor = label === 'Bullish' ? '#089981' : (label === 'Bearish' ? '#f23645' : '#a1a1aa');
            var sentEmoji = label === 'Bullish' ? '&#128200;' : (label === 'Bearish' ? '&#128201;' : '&#127919;');
            var summary = _escHtml(n.excerpt || n.summary || n.snippet || 'No additional details available.');
            var cleanTitle = _cleanTitle(n.title);

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
            overlay.setAttribute('tabindex', '-1');

            var modal = document.createElement('div');
            modal.style.cssText = 'background:#111;border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:2rem;max-width:620px;width:90%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.6);';

            var linkUrl = n.url && n.url !== '#' ? n.url : (n.ticker ? 'stock.html?ticker=' + encodeURIComponent(n.ticker) : null);
            var readMoreBtn = linkUrl ? '<a href="' + _escHtml(linkUrl) + '" target="_blank" rel="noopener" style="padding:0.6rem 1.5rem;background:#4A90E2;border-radius:8px;color:#fff;font-size:0.85rem;text-decoration:none;font-weight:600;">Read Full Article &rarr;</a>' : '';
            var closeId = 'newsDetailClose_' + Date.now();
            modal.innerHTML =
                '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">' +
                    '<div style="font-size:0.8rem;color:' + sentColor + ';background:rgba(255,255,255,0.05);padding:4px 12px;border-radius:20px;font-weight:600;">' + sentEmoji + ' ' + label + '</div>' +
                    (n.ticker ? '<div style="font-size:0.8rem;color:#4A90E2;font-weight:600;padding:4px 12px;background:rgba(74,144,226,0.1);border-radius:20px;">' + _escHtml(n.ticker) + '</div>' : '') +
                '</div>' +
                '<h2 style="font-size:1.25rem;font-weight:700;color:#fff;margin-bottom:0.75rem;line-height:1.45;">' + _escHtml(cleanTitle) + '</h2>' +
                '<div style="display:flex;gap:1rem;flex-wrap:wrap;font-size:0.8rem;color:#a1a1aa;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,0.06);">' +
                    '<span>' + _escHtml(n.source || 'Market News') + '</span>' +
                    '<span>&bull;</span>' +
                    '<span>' + (n.published_at ? new Date(n.published_at).toLocaleString('en-IN', {dateStyle:'medium', timeStyle:'short'}) : '') + '</span>' +
                '</div>' +
                '<div style="font-size:0.95rem;color:#d1d1d6;line-height:1.75;">' + summary + '</div>' +
                '<div style="display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;">' +
                    readMoreBtn +
                    '<button id="' + closeId + '" style="padding:0.6rem 1.5rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;cursor:pointer;font-size:0.85rem;">Close</button>' +
                '</div>';

            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            overlay.focus();

            // Close handlers
            overlay.addEventListener('click', function (e) { if (e.target === overlay) document.body.removeChild(overlay); });
            overlay.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.removeChild(overlay); });
            document.getElementById(closeId).addEventListener('click', function () { document.body.removeChild(overlay); });
        }

        // Expose globally (called from event delegation)
        window.openPageNewsDetail = openPageNewsDetail;

        /* ---- Event delegation for news cards ------------------------------------------------------ */

        document.addEventListener('click', function (e) {
            // News card click &rarr; open detail
            var card = e.target.closest('.news-card[data-news-idx]');
            if (card && !e.target.closest('.bookmark-btn')) {
                var idx = parseInt(card.getAttribute('data-news-idx'), 10);
                if (!isNaN(idx)) openPageNewsDetail(idx);
                return;
            }
            // Bookmark button click
            var bmBtn = e.target.closest('.bookmark-btn[data-bm-url]');
            if (bmBtn) {
                e.stopPropagation();
                var url = bmBtn.getAttribute('data-bm-url');
                if (!url) return;
                var idx2 = bookmarks.indexOf(url);
                if (idx2 >= 0) { bookmarks.splice(idx2, 1); bmBtn.classList.remove('saved'); }
                else { bookmarks.push(url); bmBtn.classList.add('saved'); }
                saveBookmarks();
                return;
            }
        });

        /* ---- Public API on window.newsApp ------------------------------------------------------------ */

        window.newsApp = {
            switchCategory: function (cat, btn) {
                currentCategory = cat;
                document.querySelectorAll('.sidebar-btn').forEach(function (b) { b.classList.remove('active'); });
                if (btn) btn.classList.add('active');
                renderNews();
            },
            showBookmarked: function (btn) {
                currentCategory = 'bookmarked';
                document.querySelectorAll('.sidebar-btn').forEach(function (b) { b.classList.remove('active'); });
                if (btn) btn.classList.add('active');
                renderNews();
            },
            filterNewsTimeout: null,
            searchAbortController: null,
            filterNews: function (q) {
                var self = this;
                if (self.filterNewsTimeout) {
                    clearTimeout(self.filterNewsTimeout);
                }
                
                self.filterNewsTimeout = setTimeout(async function() {
                    var searchVal = (q || '').trim();
                    // Autocorrect common typos
                    if (searchVal.toLowerCase() === 'relience') searchVal = 'RELIANCE';
                    
                    var stockVal = (document.getElementById('stockFilter').value || '').trim().toUpperCase();
                    var query = stockVal || searchVal.toUpperCase();
                    var featured = document.getElementById('featuredHeadline');
                    
                    if (!query) {
                        if (self.searchAbortController) self.searchAbortController.abort();
                        renderList(allNews);
                        var container = document.getElementById('newsContainer');
                        if (container) container.style.opacity = '1';
                        if (featured) featured.style.display = 'block';
                        return;
                    }
                    
                    if (featured) featured.style.display = 'none';
                    
                    if (self.searchAbortController) {
                        self.searchAbortController.abort();
                    }
                    self.searchAbortController = new AbortController();
                    
                    var container = document.getElementById('newsContainer');
                    if (container) {
                        container.style.opacity = '1';
                        container.innerHTML = '<div style="padding:4rem;text-align:center;color:#4A90E2;"><div style="width:40px;height:40px;border:4px solid rgba(74,144,226,0.2);border-top-color:#4A90E2;border-radius:50%;animation:dashNewsSpinAnim 0.8s linear infinite;margin:0 auto 1rem;"></div><div style="font-size:1.2rem;font-weight:600;">Searching live news for "' + _escHtml(query) + '"...</div></div>';
                    }
                    
                    try {
                        var articles = await _searchGoogleRSS(query, self.searchAbortController.signal);
                        if (articles.length > 0) {
                            renderList(articles);
                        } else {
                            if (container) container.innerHTML = '<div style="padding:4rem;text-align:center;color:#a1a1aa;">No news found for "' + _escHtml(query) + '".</div>';
                        }
                    } catch(e) {
                        if (e.name !== 'AbortError') {
                            console.error('Search error:', e);
                            if (container) container.innerHTML = '<div style="padding:4rem;text-align:center;color:#f23645;">Failed to fetch news. Please check your connection.</div>';
                        }
                    }
                }, 400);
            },
            toggleBookmark: function (url, el) {
                if (!url) return;
                var idx = bookmarks.indexOf(url);
                if (idx >= 0) { bookmarks.splice(idx, 1); if (el) el.classList.remove('saved'); }
                else { bookmarks.push(url); if (el) el.classList.add('saved'); }
                saveBookmarks();
            }
        };

        /* ---- Data loading ---------------------------------------------------------------------------------------------- */

        function _normaliseArticle(a, defaultSource) {
            return {
                ticker: a.ticker || a.symbol || 'MARKET',
                title: a.title || a.headline || '',
                excerpt: a.excerpt || a.snippet || a.summary || '',
                published_at: a.published_at || a.pubDate || a.published || new Date().toISOString(),
                sentiment: { label: _normaliseSentiment(a.sentiment) },
                url: a.url || a.link || '',
                source: a.source || defaultSource || 'News'
            };
        }

        async function _searchGoogleRSS(q, signal) {
            try {
                var resp = await fetch('/api/news/search/' + encodeURIComponent(q), { signal: signal || AbortSignal.timeout(10000) });
                if (resp.ok) {
                    var articles = await resp.json();
                    return Array.isArray(articles) ? articles : [];
                }
            } catch(e) {
                if (e && e.name === 'AbortError') throw e;
            }
            return [];
        }

        async function _fetchGoogleNewsRSS() {
            var queries = ['NSE+India+stock+market+today', 'Nifty+Sensex+today'];
            var allArticles = [];
            for (var i = 0; i < queries.length; i++) {
                try {
                    var results = await _searchGoogleRSS(queries[i], AbortSignal.timeout(10000));
                    allArticles = allArticles.concat(results);
                } catch(e) {
                    if (e && e.name === 'AbortError') continue;
                }
                if (allArticles.length >= 10) break;
            }
            return allArticles;
        }

        async function loadNews() {
            var statusEl = document.getElementById('newsStatus');
            var container = document.getElementById('newsContainer');

            try {
                var signal = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(15000) : undefined;
                var resp = await fetch('/api/news/search/market', signal ? { signal: signal } : {});
                var data = resp.ok ? await resp.json() : [];
                var articles = (Array.isArray(data) ? data : []).map(function(a) {
                    return _normaliseArticle(a, 'ScanX');
                });

                if (articles.length > 0) {
                    articles.sort(function(a, b) { return new Date(b.published_at || 0) - new Date(a.published_at || 0); });
                    allNews = articles;
                    renderNews();
                    updateBookmarkCount();

                    var first = allNews[0];
                    document.getElementById('featuredTitle').textContent = _cleanTitle(first.title);
                    document.getElementById('featuredExcerpt').textContent = first.excerpt || '';
                    if (first.url) {
                        document.getElementById('featuredHeadline').onclick = function() { window.open(first.url, '_blank'); };
                    }
                    if (statusEl) statusEl.style.display = 'none';
                } else {
                    throw new Error('empty');
                }
            } catch(e) {
                if ((!allNews || !allNews.length) && container) {
                    container.innerHTML = '<div style="padding:3rem;text-align:center;color:#a1a1aa;">News temporarily unavailable. Please try again shortly.</div>';
                }
            }
        }

        // Initial load + auto-refresh every 60 seconds
        loadNews();
        var _newsInterval = setInterval(loadNews, 60000);

        // Pause refresh when tab is hidden (save resources)
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                clearInterval(_newsInterval);
                _newsInterval = null;
            } else if (!_newsInterval) {
                _newsInterval = setInterval(loadNews, 60000);
                loadNews();
            }
        });

    })();
