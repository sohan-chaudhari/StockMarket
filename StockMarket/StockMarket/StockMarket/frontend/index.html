    <!-- INSTANT TICKER SEED SCRIPT (Prevents Flash) -->
    <script>
    (function() {
        try {
            var cachedRaw = localStorage.getItem('llp');
            var cachedTs = localStorage.getItem('llp_ts');
            if (cachedRaw && cachedTs) {
                var ts = parseInt(cachedTs, 10);
                if (Date.now() - ts < 600000) { // 10 min TTL
                    var prices = JSON.parse(cachedRaw);
                    document.addEventListener("DOMContentLoaded", function() {
                        for (var t in prices) {
                            var pEl = document.getElementById("strip-price-" + t);
                            var cEl = document.getElementById("strip-change-" + t);
                            if (pEl && cEl) {
                                var data = prices[t];
                                var chg = parseFloat(data.change);
                                pEl.textContent = parseFloat(data.current_price).toFixed(2);
                                cEl.textContent = (chg >= 0 ? "+" : "") + chg.toFixed(2) + " (" + parseFloat(data.change_pct).toFixed(2) + "%)";
                                cEl.className = "change " + (chg >= 0 ? "text-green" : "text-red");
                            }
                        }
                    });
                }
            }
        } catch(e) {}
    })();
    </script>

    <script>
        // --- AUTH CHECK ---
        (function checkAuth() {
            const token = sessionStorage.getItem('token');
            if (token) {
                // If logged in, redirect to dashboard
                window.location.href = 'home.html';
            }
        })();

        // CSRF Logic
        let csrfToken = '';
        async function fetchCSRF() {
            try {
                const res = await fetch('/api/csrf-token');
                if (res.ok) {
                    const data = await res.json();
                    csrfToken = data.csrf_token;
                }
            } catch (e) { console.error(e); }
        }
        fetchCSRF();
    </script>
