<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Chart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #tv_chart_container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="tv_chart_container"></div>

  <script src="charting_library/charting_library.standalone.js"></script>
  <script src="stocks.js"></script>
  <script src="cache.js"></script>
  <script src="dashboard.js"></script>
  <script src="tv-datafeed.js"></script>
  <script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var ticker = params.get('ticker') || 'NIFTY';
  var interval = params.get('interval') || '15';
  // Only allow valid resolutions
  var validRes = ['1','5','15','30','60','120','240','D','W','M'];
  if (validRes.indexOf(interval) === -1) interval = '15';

  // Start WebSocket; include initial ticker so first dashboard_price_update carries it
  if (window.DashboardWS) {
    window.DashboardWS.start([ticker]);
  }

  window.tvWidget = new TradingView.widget({
    container:   'tv_chart_container',
    locale:      'en',
    symbol:      ticker,
    interval:    interval,
    timezone:    'Asia/Kolkata',
    theme:       'Dark',
    datafeed:    TVDatafeed,
    library_path: 'charting_library/',
    debug:       true,
    autosize:    true,
    loading_screen: { backgroundColor: '#131722' },
    disabled_features: [
      'header_compare',
      'header_screenshot',
      'header_undo_redo',
      'header_settings',
      'save_chart_to_template',
      'create_volume_indicator_by_default',
      'volume_force_overlay',
      'show_chart_property_page',
      'use_localstorage_for_settings',
      'left_toolbar',
    ],
    enabled_features: [
      'hide_left_toolbar_by_default',
    ],
    overrides: {
      'paneProperties.background': '#131722',
      'paneProperties.vertGridProperties.color': 'rgba(42,46,57,0.5)',
      'paneProperties.horzGridProperties.color': 'rgba(42,46,57,0.5)',
      'paneProperties.crossHairProperties.color': '#758696',
      'scalesProperties.textColor': '#9598a1',
      'mainSeriesProperties.candleStyle.upColor': '#26a69a',
      'mainSeriesProperties.candleStyle.downColor': '#ef5350',
      'mainSeriesProperties.candleStyle.borderUpColor': '#26a69a',
      'mainSeriesProperties.candleStyle.borderDownColor': '#ef5350',
      'mainSeriesProperties.candleStyle.wickUpColor': '#26a69a',
      'mainSeriesProperties.candleStyle.wickDownColor': '#ef5350',
      'volumePaneSize': 'short',
    },
    studies_overrides: {
      'volume.volume.color.0': '#ef5350',
      'volume.volume.color.1': '#26a69a',
    },
  });

  window.tvWidget.onChartReady(function () {
    // Notify stock page JS that chart is ready
    window.dispatchEvent(new CustomEvent('tv_chart_ready', { detail: { widget: window.tvWidget } }));
  });
})();
  </script>
</body>
</html>
